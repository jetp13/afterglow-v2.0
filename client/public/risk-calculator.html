<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風險計算器｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    .ag-risk-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .ag-page {
      min-height: 100vh;
      min-height: 100svh;
      background: #000;
    }

    .ag-main-scroll {
      min-height: 100vh;
      min-height: 100svh;
      padding-bottom: calc(120px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .ag-risk-title {
      font-size: 32px;
      color: #ff6bd9;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 107, 217, 0.6);
      margin-bottom: 20px;
    }

    .ag-harm-reduction-box {
      border: 1px solid #ff6bd9;
      background: rgba(255, 107, 217, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 107, 217, 0.1);
    }

    .ag-info-icon {
      color: #ff6bd9;
      font-size: 24px;
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    .ag-harm-text {
      color: #ffcae9;
      font-size: 14px;
      line-height: 1.6;
    }

    .ag-harm-title {
      font-weight: bold;
      color: #ff6bd9;
      margin-bottom: 4px;
      display: block;
    }

    .ag-footer-standard {
      margin-top: 32px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
  </style>
</head>
<body class="ag-page">
  <a href="/support-main.html" class="ag-back-button neon-style" aria-label="返回">
    <span class="ag-neon-icon-back"></span>
  </a>

  <div class="ag-main-scroll">
    <div class="ag-container ag-container-sm">
      <div class="ag-wild-header">
        <img src="/assets/logo-handwritten.png" class="ag-wild-logo" alt="Afterglow">
      </div>

      <div class="ag-risk-header">
        <h1 class="ag-risk-title ag-visually-hidden">風險計算器</h1>
      </div>

      <div class="ag-harm-reduction-box">
        <div class="ag-info-icon">
          <span class="ag-neon-icon ag-icon-shield"></span>
        </div>
        <div class="ag-harm-text">
          <span class="ag-harm-title">減害立場：</span>
          我們理解物質使用是個人選擇。此工具旨在提供風險資訊，協助您做出更安全的決定，而非評判或禁止。如您選擇使用，請了解風險並採取減害措施。
        </div>
      </div>

      <div class="ag-section-label">選擇您使用或考慮使用的物質（最多 4 種）</div>

      <div class="ag-capsule-grid" id="capsule-grid">
        <!-- Buttons will be populated by JS -->
      </div>

      <div id="result-container" class="ag-result-container">
        <div class="ag-result-glow"></div>
        <div class="ag-result-text-layer" id="result-circle">?</div>
      </div>

      <div class="ag-result-text-box" id="result-box">
        <div class="ag-result-title" id="result-title">請選擇物質</div>
        <div class="ag-result-desc" id="result-desc">選擇您使用或考慮使用的物質以評估風險</div>
      </div>

      <div class="ag-warning-box">
        <div class="ag-warning-title">
          <span class="ag-neon-icon ag-icon-alert"></span> 重要免責聲明
        </div>
        <ul class="ag-warning-list">
          <li>此工具僅供參考，無法涵蓋所有個體差異與潛在風險。</li>
          <li>「低風險」不代表「絕對安全」。</li>
          <li>若出現嚴重不適，請立即尋求醫療協助。</li>
        </ul>
      </div>

      <footer class="ag-footer-standard">
        <div class="ag-footer__inner">
          <nav class="ag-footer__links" aria-label="Legal and info links">
            <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
            <span class="ag-footer__separator">•</span>
            <a href="/legal.html" class="ag-footer__link">法律免責</a>
            <span class="ag-footer__separator">•</span>
            <a href="/terms.html" class="ag-footer__link">使用條款</a>
            <span class="ag-footer__separator">•</span>
            <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
          </nav>
          <p class="ag-footer__copyright">
            © 2025 Afterglow. All rights reserved.
          </p>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
