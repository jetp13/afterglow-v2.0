<html lang="zh-Hant" data-age-pending>
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/assets/layout.css">

  <style>html[data-age-pending] body > :not(noscript){display:none!important}</style><script src="/assets/adult-gate.js"></script>
  <style>
    /* ── accent 色：權利支援 — 語意電藍（對齊入口色）── */
    :root {
      --em-accent:        rgba(41, 121, 255, 0.90);
      --em-accent-glow:   rgba(41, 121, 255, 0.38);
      --em-accent-border: rgba(41, 121, 255, 0.35);
    }

    /* ── 頁面特定：區塊間距 ── */
    .ag-section { margin-bottom: var(--em-space-xl); }

    /* ── 頁面特定： Do / Don't 清單 ── */
    .ag-dodont-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--em-space-lg);
    }
    .ag-list-box {
      background: var(--em-surface-0);
      border-radius: var(--em-radius-md);
      padding: var(--em-space-lg);
    }
    .ag-list-title {
      font-size: var(--em-font-h2);
      margin-bottom: var(--em-space-md);
      text-align: center;
      font-weight: 500;
    }
    .ag-do-title   { color: rgba(160, 240, 180, 0.85); }
    .ag-dont-title { color: rgba(255, 160, 160, 0.85); }
    .ag-check-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .ag-check-list li {
      position: relative;
      padding-left: 24px;
      margin-bottom: var(--em-space-sm);
      font-size: var(--em-font-body);
      color: var(--em-text-secondary);
      line-height: 1.55;
    }
    .ag-check-list.do li::before {
      content: '';
      position: absolute;
      left: 0; top: 4px;
      width: 12px; height: 6px;
      border-left: 1.5px solid rgba(160, 240, 180, 0.75);
      border-bottom: 1.5px solid rgba(160, 240, 180, 0.75);
      transform: rotate(-45deg);
    }
    .ag-check-list.dont li::before {
      content: '';
      position: absolute;
      left: 0; top: 10px;
      width: 14px; height: 1.5px;
      background: rgba(255, 160, 160, 0.70);
      transform: rotate(45deg);
    }
    .ag-check-list.dont li::after {
      content: '';
      position: absolute;
      left: 0; top: 10px;
      width: 14px; height: 1.5px;
      background: rgba(255, 160, 160, 0.70);
      transform: rotate(-45deg);
    }

    /* ── 頁面特定：資源電話色 ── */
    .ag-resource-item {
      background: var(--em-surface-1);
      padding: var(--em-space-md);
      border-radius: var(--em-radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--em-font-body);
      color: var(--em-text-secondary);
    }
    .ag-resource-phone {
      color: var(--em-accent);
      font-weight: 500;
    }
    .ag-resources-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--em-space-sm);
    }

    @media (min-width: 768px) {
      .ag-principles-grid  { grid-template-columns: repeat(3, 1fr); }
      .ag-rights-grid      { grid-template-columns: repeat(2, 1fr); }
      .ag-dodont-container { grid-template-columns: 1fr 1fr; }
      .ag-resources-list   { grid-template-columns: 1fr 1fr; }
    }
  </style>
  <noscript><style>body > :not(noscript){display:none!important}</style></noscript>
</head>
