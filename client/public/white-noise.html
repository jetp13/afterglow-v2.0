  <style>
    .ag-white-noise-visual {
      width: min(58vw, 246px);
      height: min(58vw, 246px);
      margin-bottom: 34px;
      isolation: isolate;
      overflow: visible;
    }

    .ag-ember-canvas {
      position: absolute;
      inset: -26%;
      width: 152%;
      height: 152%;
      z-index: 0;
      pointer-events: none;
    }

    .ag-white-ring {
      position: absolute;
      width: min(51vw, 212px);
      height: min(51vw, 212px);
      border-radius: 50%;
      z-index: 1;
      opacity: var(--ag-ring-opacity, 0.94);
      transform: scale(var(--ag-ring-scale, 1));
      transition: opacity 360ms ease-out, transform 320ms ease-out, filter 360ms ease-out;
      will-change: opacity, transform, filter;
    }

    .ag-white-ring::before,
    .ag-white-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ag-white-ring::before {
      inset: 0;
      border: 2px solid rgba(244, 246, 242, 0.92);
      background: radial-gradient(circle, rgba(244, 246, 242, 0.028) 58%, rgba(244, 246, 242, 0) 73%);
      box-shadow:
        0 0 1px rgba(255, 255, 255, 0.92),
        0 0 7px rgba(240, 242, 238, 0.30),
        0 0 18px rgba(240, 242, 238, 0.13),
        0 0 42px rgba(240, 242, 238, 0.055),
        inset 0 0 1px rgba(255, 255, 255, 0.82),
        inset 0 0 8px rgba(240, 242, 238, 0.10);
    }

    .ag-white-ring::after {
      inset: -4px;
      border: 1px solid rgba(232, 235, 231, 0.22);
      box-shadow: 0 0 14px rgba(240, 242, 238, 0.075);
      opacity: 0.78;
    }

    .ag-player-visual--noise.playing .ag-white-ring {
      filter: brightness(1.035);
    }

    @media (max-width: 480px) {
      .ag-main-scroll { overflow-x: hidden; }
      .ag-white-noise-visual {
        width: min(62vw, 224px);
        height: min(62vw, 224px);
        margin-bottom: 30px;
      }
      .ag-white-ring {
        width: min(54vw, 192px);
        height: min(54vw, 192px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ag-white-ring {
        transition-duration: 900ms;
        filter: none;
      }
      .ag-white-ring::before {
        box-shadow:
          0 0 1px rgba(255, 255, 255, 0.72),
          0 0 8px rgba(240, 242, 238, 0.12),
          inset 0 0 1px rgba(255, 255, 255, 0.62);
      }
    }
  </style>

</head>
<body class="ag-page">

  <div class="ag-page-title-block">
    <p class="ag-page-title"><strong>白噪音</strong> · WHITE NOISE</p>
  </div>

  <div class="ag-main-scroll">
    <section class="ag-player" aria-label="白噪音播放器">

      <!-- 視覺：白色霓虹燈管環＋白色火塵粒子 -->
      <div class="ag-player-visual ag-player-visual--noise ag-white-noise-visual" id="agVisual">
        <canvas class="ag-ember-canvas" id="agEmberCanvas" aria-hidden="true"></canvas>
        <div class="ag-white-ring" id="agVisualRing" aria-hidden="true"></div>
      </div>

      <!-- 曲目資訊 -->
      <div class="ag-track-info">
        <p class="ag-track-title">柴火燃燒</p>
        <p class="ag-track-hint">讓白色微塵把火收回身體裡</p>
      </div>

      <!-- 進度條（白噪音為循環音，顯示已播放時間）-->
      <div class="ag-progress-wrap">
        <input type="range" class="ag-progress-bar" id="agProgressBar"
          min="0" max="100" value="0" step="0.1"
          aria-label="播放進度" style="--progress: 0%">
        <div class="ag-progress-times">
          <span id="agCurrentTime">0:00</span>
          <span id="agDuration">--:--</span>
        </div>
      </div>

      <!-- 控制列 -->
      <div class="ag-controls">
        <button class="ag-ctrl-btn ag-play-btn" id="agPlayBtn" aria-label="播放">
          <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <polygon points="8,4 20,12 8,20" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none">
            <line x1="9" y1="5" x2="9" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="5" x2="15" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- 音量控制 -->
      <div class="ag-volume-container">
        <span aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="15" y1="10" x2="15" y2="14"/></svg>
        </span>
        <input type="range" min="0" max="1" step="0.01" value="0.5" class="ag-volume-slider" id="agVolumeSlider" aria-label="音量調整">
        <span aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </span>
      </div>

      <p class="ag-status-text" id="agStatusText">點擊播放</p>

    </section>
  </div>

  <audio id="agAudio" loop preload="auto">
    <source src="/assets/audio/fire-loop.mp3" type="audio/mpeg">
  </audio>

      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>

  <script src="/assets/ag-player.js"></script>
  <script>
    AgPlayer.init({
      audioId:        'agAudio',
      playBtnId:      'agPlayBtn',
      progressBarId:  'agProgressBar',
      currentTimeId:  'agCurrentTime',
      durationId:     'agDuration',
      volumeSliderId: 'agVolumeSlider',
      visualId:       'agVisual',
      statusTextId:   'agStatusText',
      iconPlayId:     'iconPlay',
      iconPauseId:    'iconPause',
      isLoop:         true,
      mediaTitle:     '白噪音 · 柴火燃燒',
      mediaArtist:    'Afterglow',
      artworkSrc:     '/assets/icons/icon-192x192.png',
      artworkSrc512:  '/assets/icons/icon-512x512.png',
      statusPlaying:  '播放中 · 讓白色微塵跟著火聲跳動',
      statusPaused:   '已暫停',
      statusIdle:     '點擊播放',
      statusEnded:    '播放結束'
    });


    (function initWhiteNoiseV2Visual() {
      const audio = document.getElementById('agAudio');
      const canvas = document.getElementById('agEmberCanvas');
      const ring = document.getElementById('agVisualRing');
      if (!audio || !canvas || !ring) return;

      const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      let reduceMotion = reduceMotionQuery.matches;
      let dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      let particles = [];
      let audioCtx = null;
      let analyser = null;
      let source = null;
      let frequencyData = null;
      let lowEnergy = 0.035;
      let midEnergy = 0.025;
      let highEnergy = 0.018;
      let previousHighEnergy = 0.018;

      function particleTotal() {
        if (reduceMotion) return 22;
        return window.innerWidth < 540 ? 48 : 66;
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        canvas.width = Math.max(1, Math.floor(bounds.width * dpr));
        canvas.height = Math.max(1, Math.floor(bounds.height * dpr));
        particles = Array.from({ length: particleTotal() }, () => createParticle(true));
      }

      function createParticle(initial = false) {
        const width = canvas.width || 1;
        const height = canvas.height || 1;
        const nearRing = Math.random() > 0.28;
        const angle = Math.random() * Math.PI * 2;
        const ringRadius = Math.min(width, height) * (0.22 + Math.random() * 0.22);
        return {
          x: nearRing ? width / 2 + Math.cos(angle) * ringRadius : Math.random() * width,
          y: initial ? (nearRing ? height / 2 + Math.sin(angle) * ringRadius : Math.random() * height) : height + Math.random() * height * 0.08,
          size: (0.45 + Math.random() * 1.55) * dpr,
          rise: (0.06 + Math.random() * 0.17) * dpr,
          drift: (Math.random() - 0.5) * 0.22 * dpr,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.10 + Math.random() * 0.48,
          tone: Math.random(),
          burst: 0,
        };
      }

      function initAnalyser() {
        if (analyser) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;

        try {
          audioCtx = new AudioCtor();
          source = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.84;
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          frequencyData = new Uint8Array(analyser.frequencyBinCount);
        } catch (_) {
          analyser = null;
          frequencyData = null;
        }
      }

      function averageBand(from, to) {
        let total = 0;
        for (let index = from; index <= to; index += 1) {
          total += frequencyData[index] || 0;
        }
        return total / (to - from + 1) / 255;
      }

      function updateEnergyBands() {
        previousHighEnergy = highEnergy;

        if (analyser && frequencyData) {
          analyser.getByteFrequencyData(frequencyData);
          lowEnergy = lowEnergy * 0.86 + averageBand(2, 18) * 0.14;
          midEnergy = midEnergy * 0.84 + averageBand(19, 68) * 0.16;
          highEnergy = highEnergy * 0.78 + averageBand(69, 150) * 0.22;
          return;
        }

        const active = !audio.paused;
        lowEnergy = lowEnergy * 0.92 + (active ? 0.075 + Math.random() * 0.035 : 0.025) * 0.08;
        midEnergy = midEnergy * 0.90 + (active ? 0.050 + Math.random() * 0.055 : 0.016) * 0.10;
        highEnergy = highEnergy * 0.88 + (active ? 0.030 + Math.random() * 0.075 : 0.010) * 0.12;
      }

      function drawParticles() {
        const width = canvas.width;
        const height = canvas.height;
        const active = !audio.paused;
        const motion = reduceMotion ? 0.10 : (active ? 1 : 0.20);
        const highDelta = Math.max(0, highEnergy - previousHighEnergy);
        const transient = active && !reduceMotion && highDelta > 0.034;

        ctx.clearRect(0, 0, width, height);

        for (let index = 0; index < particles.length; index += 1) {
          const particle = particles[index];
          particle.phase += 0.010 + midEnergy * 0.030;
          particle.y -= (particle.rise + lowEnergy * 0.42 * dpr + midEnergy * 0.26 * dpr) * motion;
          particle.x += (particle.drift + Math.sin(particle.phase) * (0.10 + midEnergy * 0.82) * dpr) * motion;

          if (transient && particle.tone > 0.72 && Math.random() < 0.11) {
            particle.burst = Math.min(1, particle.burst + 0.85);
          }

          if (particle.burst > 0.02) {
            particle.x += (Math.random() - 0.5) * (1.8 + highEnergy * 10) * dpr;
            particle.y -= (0.7 + highEnergy * 5.8) * dpr;
            particle.burst *= 0.84;
          }

          if (particle.y < -10 || particle.x < -28 || particle.x > width + 28) {
            particles[index] = createParticle(false);
            continue;
          }

          const flicker = 0.56 + Math.sin(particle.phase) * 0.34 + Math.random() * highEnergy * 0.18;
          const burstGlow = 1 + particle.burst * 0.65;
          const alpha = Math.max(0.018, Math.min(0.86, particle.alpha * flicker * (0.44 + lowEnergy * 0.24 + midEnergy * 0.36 + highEnergy * 0.48)));
          const radius = particle.size * (0.86 + midEnergy * 0.28 + particle.burst * 0.22);

          if (particle.tone > 0.78) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.90, alpha * 0.92 * burstGlow)})`;
          } else if (particle.tone < 0.30) {
            ctx.fillStyle = `rgba(220, 223, 220, ${alpha * 0.34})`;
          } else {
            ctx.fillStyle = `rgba(230, 232, 228, ${alpha * 0.56})`;
          }

          ctx.beginPath();
          ctx.arc(particle.x, particle.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateRing() {
        const active = !audio.paused;
        const scale = 1 + (reduceMotion ? 0 : Math.min(0.010, lowEnergy * 0.011 + highEnergy * 0.003));
        const opacity = 0.92 + (active ? Math.min(0.075, lowEnergy * 0.075 + midEnergy * 0.026) : 0);
        ring.style.setProperty('--ag-ring-scale', scale.toFixed(4));
        ring.style.setProperty('--ag-ring-opacity', opacity.toFixed(3));
      }

      function animate() {
        updateEnergyBands();
        drawParticles();
        updateRing();
        requestAnimationFrame(animate);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas, { passive: true });
      reduceMotionQuery.addEventListener('change', function (event) {
        reduceMotion = event.matches;
        resizeCanvas();
      });
      audio.addEventListener('play', function () {
        initAnalyser();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function () {});
        }
      });
      requestAnimationFrame(animate);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
