  <style>
    .ag-white-noise-visual {
      width: min(56vw, 244px);
      height: min(56vw, 244px);
      margin-bottom: 34px;
      isolation: isolate;
    }
    .ag-ember-canvas {
      position: absolute;
      inset: -24%;
      width: 148%;
      height: 148%;
      pointer-events: none;
      z-index: 0;
    }
    .ag-white-ring {
      position: absolute;
      width: min(52vw, 214px);
      height: min(52vw, 214px);
      border-radius: 50%;
      z-index: 1;
      transform: scale(var(--ag-ring-scale, 1));
      opacity: var(--ag-ring-opacity, 0.95);
      transition: transform 280ms ease-out, opacity 300ms ease-out, filter 300ms ease-out;
      will-change: transform, opacity, filter;
    }
    .ag-white-ring::before,
    .ag-white-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }
    .ag-white-ring::before {
      border: 2px solid rgba(244, 246, 242, 0.92);
      box-shadow:
        0 0 1px rgba(255, 255, 255, 0.92),
        0 0 7px rgba(240, 242, 238, 0.30),
        0 0 18px rgba(240, 242, 238, 0.13),
        0 0 42px rgba(240, 242, 238, 0.055),
        inset 0 0 1px rgba(255, 255, 255, 0.82),
        inset 0 0 8px rgba(240, 242, 238, 0.10);
      background: radial-gradient(circle, rgba(244, 246, 242, 0.035) 58%, rgba(244, 246, 242, 0) 74%);
    }
    .ag-white-ring::after {
      inset: -4px;
      border: 1.2px solid rgba(236, 239, 236, 0.24);
      box-shadow: 0 0 16px rgba(240, 242, 238, 0.08);
      opacity: 0.88;
    }
    .ag-player-visual--noise.playing .ag-white-ring {
      filter: brightness(1.03);
    }
    @media (max-width: 480px) {
      .ag-main-scroll { overflow-x: hidden; }
      .ag-player { padding-left: 20px; padding-right: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ag-white-ring { transition-duration: 900ms; }
      .ag-white-ring::before { box-shadow: 0 0 1px rgba(255,255,255,0.6); }
    }
  </style>

</head>
<body class="ag-page">

  <a href="/menu.html" class="ag-back-button neon-style" aria-label="返回選單"><span class="ag-neon-icon-back"></span></a>

  <a href="/home.html" class="ag-page-logo" aria-label="回到首頁">
    <img src="/assets/logo-handwritten-nobg.png" alt="Afterglow">
  </a>

  <div class="ag-page-title-block">
    <p class="ag-page-title"><strong>白噪音</strong> · WHITE NOISE</p>
  </div>

  <div class="ag-main-scroll">
    <section class="ag-player" aria-label="白噪音播放器">

      <!-- 視覺：白色螢光圓環＋灰燼微塵 -->
      <div class="ag-player-visual ag-player-visual--noise ag-white-noise-visual" id="agVisual">
        <canvas class="ag-ember-canvas" id="agEmberCanvas" aria-hidden="true"></canvas>
        <div class="ag-white-ring" id="agVisualRing" aria-hidden="true"></div>
      </div>

      <!-- 曲目資訊 -->
      <div class="ag-track-info">
        <p class="ag-track-title">專注與放鬆</p>
        <p class="ag-track-hint">讓背景音幫你沉澱下來</p>
      </div>

      <!-- 進度條（白噪音為循環音，顯示已播放時間）-->
      <div class="ag-progress-wrap">
        <input type="range" class="ag-progress-bar" id="agProgressBar"
          min="0" max="100" value="0" step="0.1"
          aria-label="播放進度" style="--progress: 0%">
        <div class="ag-progress-times">
          <span id="agCurrentTime">0:00</span>
          <span id="agDuration">--:--</span>
        </div>
      </div>

      <!-- 控制列 -->
      <div class="ag-controls">
        <button class="ag-ctrl-btn ag-play-btn" id="agPlayBtn" aria-label="播放">
          <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <polygon points="8,4 20,12 8,20" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none">
            <line x1="9" y1="5" x2="9" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="5" x2="15" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- 音量控制 -->
      <div class="ag-volume-container">
        <span aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="15" y1="10" x2="15" y2="14"/></svg>
        </span>
        <input type="range" min="0" max="1" step="0.01" value="0.5" class="ag-volume-slider" id="agVolumeSlider" aria-label="音量調整">
        <span aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </span>
      </div>

      <p class="ag-status-text" id="agStatusText">點擊播放</p>

    </section>
  </div>

  <audio id="agAudio" loop preload="auto">
    <source src="/assets/audio/fire-loop.mp3" type="audio/mpeg">
  </audio>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>
  </footer>

  <script src="/assets/ag-player.js"></script>
  <script>
    AgPlayer.init({
      audioId:        'agAudio',
      playBtnId:      'agPlayBtn',
      progressBarId:  'agProgressBar',
      currentTimeId:  'agCurrentTime',
      durationId:     'agDuration',
      volumeSliderId: 'agVolumeSlider',
      visualId:       'agVisual',
      statusTextId:   'agStatusText',
      iconPlayId:     'iconPlay',
      iconPauseId:    'iconPause',
      isLoop:         true,
      mediaTitle:     '白噪音 · 專注與放鬆',
      mediaArtist:    'Afterglow',
      artworkSrc:     '/assets/icons/icon-192x192.png',
      artworkSrc512:  '/assets/icons/icon-512x512.png',
      statusPlaying:  '播放中 · 讓聲音帶你沉澱',
      statusPaused:   '已暫停',
      statusIdle:     '點擊播放',
      statusEnded:    '播放結束'
    });



    (function initWhiteNoiseVisual() {
      const audio = document.getElementById('agAudio');
      const ring = document.getElementById('agVisualRing');
      const canvas = document.getElementById('agEmberCanvas');
      if (!audio || !ring || !canvas) return;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      let dpr = Math.min(window.devicePixelRatio || 1, 1.8);
      let particles = [];
      let analyser = null;
      let freqData = null;
      let audioCtx = null;
      let source = null;
      let low = 0.05;
      let mid = 0.05;
      let high = 0.04;
      let prevHigh = 0.04;
      const particleCount = reduceMotion ? 24 : (window.innerWidth < 540 ? 52 : 68);

      function resize() {
        const r = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(r.width * dpr));
        canvas.height = Math.max(1, Math.floor(r.height * dpr));
        particles = Array.from({ length: particleCount }, () => spawn(true));
      }

      function spawn(initial = false) {
        const w = canvas.width;
        const h = canvas.height;
        return {
          x: Math.random() * w,
          y: initial ? Math.random() * h : h + Math.random() * (h * 0.1),
          size: (Math.random() * 1.55 + 0.45) * dpr,
          rise: (Math.random() * 0.18 + 0.07) * dpr,
          sway: Math.random() * 0.55 + 0.18,
          drift: (Math.random() - 0.5) * 0.22,
          alpha: Math.random() * 0.52 + 0.1,
          twinkle: Math.random() * Math.PI * 2,
          tone: Math.random(),
          burst: 0,
        };
      }

      function tryInitAnalyser() {
        if (analyser) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        try {
          audioCtx = new Ctx();
          source = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.84;
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          freqData = new Uint8Array(analyser.frequencyBinCount);
        } catch (_) {
          analyser = null;
          freqData = null;
        }
      }

      function bandAvg(from, to) {
        let sum = 0;
        for (let i = from; i <= to; i += 1) sum += freqData[i] || 0;
        return (sum / (to - from + 1)) / 255;
      }

      function readBands() {
        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          const nextLow = bandAvg(2, 18);
          const nextMid = bandAvg(19, 62);
          const nextHigh = bandAvg(63, 130);
          low = low * 0.86 + nextLow * 0.14;
          mid = mid * 0.84 + nextMid * 0.16;
          high = high * 0.8 + nextHigh * 0.2;
          return;
        }
        const paused = audio.paused;
        low = low * 0.92 + (paused ? 0.03 : 0.08 + Math.random() * 0.04) * 0.08;
        mid = mid * 0.9 + (paused ? 0.02 : 0.06 + Math.random() * 0.06) * 0.1;
        high = high * 0.88 + (paused ? 0.01 : 0.04 + Math.random() * 0.08) * 0.12;
      }

      function animate() {
        const w = canvas.width;
        const h = canvas.height;
        if (!w || !h) return requestAnimationFrame(animate);

        prevHigh = high;
        readBands();
        const active = !audio.paused;
        const motion = reduceMotion ? 0.12 : (active ? 1 : 0.22);
        const highDelta = Math.max(0, high - prevHigh);
        const transient = active && highDelta > 0.038;

        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i += 1) {
          const p = particles[i];
          const rise = (p.rise + low * 0.46 * dpr + mid * 0.34 * dpr) * motion;
          const jitter = (Math.sin(p.twinkle) * (0.18 + mid * 0.9) + p.drift) * motion;
          p.y -= rise;
          p.x += jitter;
          p.twinkle += 0.011 + mid * 0.03;

          if (!reduceMotion && transient && Math.random() < 0.12 && p.tone > 0.66) p.burst = Math.min(1, p.burst + 0.95);
          if (p.burst > 0.02) {
            p.x += (Math.random() - 0.5) * (2.2 + high * 12) * dpr;
            p.y -= (0.8 + high * 6.5) * dpr;
            p.burst *= 0.84;
          }

          if (p.y < -10 || p.x < -26 || p.x > w + 26) particles[i] = spawn();

          const twinkle = 0.58 + Math.sin(p.twinkle) * 0.42;
          const burstGlow = 1 + p.burst * 0.65;
          const alpha = Math.max(0.02, Math.min(0.92, p.alpha * twinkle * (0.4 + low * 0.3 + mid * 0.4 + high * 0.45)));
          ctx.fillStyle = p.tone > 0.75
            ? `rgba(255,255,255,${alpha * 0.9 * burstGlow})`
            : (p.tone < 0.34 ? `rgba(220,223,220,${alpha * 0.34})` : `rgba(230,232,228,${alpha * 0.56})`);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.88 + mid * 0.35 + p.burst * 0.25), 0, Math.PI * 2);
          ctx.fill();
        }

        const ringScale = 1 + (reduceMotion ? 0 : Math.min(0.01, low * 0.012 + high * 0.004));
        const ringOpacity = 0.92 + (active ? Math.min(0.08, low * 0.08 + mid * 0.03) : 0.0);
        ring.style.setProperty('--ag-ring-scale', ringScale.toFixed(4));
        ring.style.setProperty('--ag-ring-opacity', ringOpacity.toFixed(3));

        requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize, { passive: true });
      audio.addEventListener('play', () => {
        tryInitAnalyser();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      });
      requestAnimationFrame(animate);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
