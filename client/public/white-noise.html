      window.location.href = '/index.html';

  <style>
    .ag-page-logo {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 20px;
      z-index: 100;
    }
    .ag-page-logo img {
      width: 110px;
      opacity: 0.85;
    }

    <p class="ag-page-title"><strong>白噪音</strong> · WHITE NOISE</p>
