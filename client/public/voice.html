<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>語音引導｜Afterglow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="/assets/layout.css">
  <link rel="stylesheet" href="/assets/ag-player.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
</head>
<body class="ag-page">

  <a href="/menu.html" class="ag-back-button neon-style" aria-label="返回選單"><span class="ag-neon-icon-back"></span></a>

  <a href="/home.html" class="ag-page-logo" aria-label="回到首頁">
    <img src="/assets/logo-handwritten-nobg.png" alt="Afterglow">
  </a>

  <div class="ag-page-title-block">
    <p class="ag-page-title"><strong>語音引導</strong> · VOICE GUIDE V1.0</p>
  </div>

  <div class="ag-main-scroll">
    <section class="ag-player ag-player--voice" aria-label="語音引導播放器">

      <!-- 視覺：霓虹光環 -->
      <div class="ag-player-visual ag-player-visual--voice" aria-hidden="true">
        <div class="ag-orb-ring" id="agOrbRing"></div>
      </div>

      <!-- 曲目資訊 -->
      <div class="ag-track-info">
        <p class="ag-track-title">進入狀態</p>
        <p class="ag-track-hint">戴上耳機，閉上眼睛，讓聲音帶你慢慢進入</p>
      </div>

      <!-- 進度條 -->
      <div class="ag-progress-wrap">
        <input type="range" class="ag-progress-bar" id="agProgressBar"
          min="0" max="100" value="0" step="0.1"
          aria-label="播放進度" style="--progress: 0%">
        <div class="ag-progress-times">
          <span id="agCurrentTime">0:00</span>
          <span id="agDuration">--:--</span>
        </div>
      </div>

      <!-- 控制列 -->
      <div class="ag-controls">

        <button class="ag-ctrl-btn" id="agRewindBtn" aria-label="倒退 15 秒">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 5.5C9.306 5.5 5.5 9.306 5.5 14s3.806 8.5 8.5 8.5 8.5-3.806 8.5-8.5"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M14 5.5L11 3M14 5.5L11 8"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="15.5" text-anchor="middle" font-size="6.5"
              font-family="system-ui,sans-serif" font-weight="300" fill="currentColor">15</text>
          </svg>
        </button>

        <button class="ag-ctrl-btn ag-play-btn" id="agPlayBtn" aria-label="播放">
          <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <polygon points="8,4 20,12 8,20" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none">
            <line x1="9" y1="5" x2="9" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="5" x2="15" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg id="iconReplay" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none">
            <path d="M12 4.5C8.41 4.5 5.5 7.41 5.5 11s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M12 4.5L9.5 2.5M12 4.5L9.5 6.5"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="ag-ctrl-btn" id="agForwardBtn" aria-label="快進 15 秒">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 5.5C18.694 5.5 22.5 9.306 22.5 14s-3.806 8.5-8.5 8.5S5.5 18.694 5.5 14"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M14 5.5L17 3M14 5.5L17 8"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="15.5" text-anchor="middle" font-size="6.5"
              font-family="system-ui,sans-serif" font-weight="300" fill="currentColor">15</text>
          </svg>
        </button>

      </div>

      <p class="ag-status-text" id="agStatusText">點擊播放開始引導</p>

    </section>
  </div>

  <audio id="agAudio" preload="metadata">
    <source src="/assets/audio/mvp-guide.mp3" type="audio/mpeg">
  </audio>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>
  </footer>

  <script src="/assets/ag-player.js"></script>
  <script>
    AgPlayer.init({
      audioId:       'agAudio',
      playBtnId:     'agPlayBtn',
      progressBarId: 'agProgressBar',
      currentTimeId: 'agCurrentTime',
      durationId:    'agDuration',
      rewindBtnId:   'agRewindBtn',
      forwardBtnId:  'agForwardBtn',
      orbRingId:     'agOrbRing',
      statusTextId:  'agStatusText',
      iconPlayId:    'iconPlay',
      iconPauseId:   'iconPause',
      iconReplayId:  'iconReplay',
      isLoop:        false,
      mediaTitle:    '語音引導 · 進入狀態',
      mediaArtist:   'Afterglow',
      artworkSrc:    '/assets/icons/icon-192x192.png',
      artworkSrc512: '/assets/icons/icon-512x512.png',
      statusPlaying: '引導進行中 · 放鬆呼吸',
      statusPaused:  '已暫停',
      statusIdle:    '點擊播放開始引導',
      statusEnded:   '引導結束 · 慢慢回來'
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
