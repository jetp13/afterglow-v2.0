<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>語音引導｜Afterglow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    .ag-inner-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
      box-sizing: border-box;
      min-height: 64px;
    }
    .ag-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 18px;
      line-height: 1;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .ag-back-btn:hover { border-color: rgba(255,255,255,0.6); color: #fff; }
    .ag-inner-logo {
      display: block;
      width: 135px;
      max-width: 38vw;
      height: auto;
      mix-blend-mode: screen;
      opacity: 0.85;
      margin-top: 6px;
    }
    .ag-page-title-block {
      padding: 0 20px 8px;
      flex-shrink: 0;
    }
    .ag-page-title {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }
    .ag-page-title strong {
      color: rgba(255,255,255,0.55);
      font-weight: 500;
    }
    .ag-voice-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 24px 28px 16px;
    }

    /* ── Visualiser container ── */
    .ag-orb-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 28px;
      flex-shrink: 0;
    }
    /*
      Layer order (back → front):
        1. canvas#agCanvas  — waveform drawn here (behind ring)
        2. div.ag-orb-ring  — static neon ring (SVG border-radius trick)
    */
    #agCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    /* Static neon ring — sits on top of canvas, masks inner area */
    .ag-orb-ring {
      position: absolute;
      /* Ring is 140px, centred in 260px container → offset 60px */
      top: 60px; left: 60px;
      width: 140px; height: 140px;
      border-radius: 50%;
      /* Black fill covers canvas inside the ring */
      background: #050505;
      border: 1.5px solid #bd00ff;
      box-shadow:
        0 0 10px rgba(189,0,255,0.55),
        0 0 24px rgba(189,0,255,0.22),
        inset 0 0 8px rgba(189,0,255,0.06);
      pointer-events: none;
    }

    .ag-track-info {
      text-align: center;
      margin-bottom: 28px;
    }
    .ag-track-title {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255,255,255,0.88);
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .ag-track-hint {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.04em;
    }

    /* ── Neon tube progress bar ── */
    .ag-progress-wrap { width: 100%; margin-bottom: 10px; }
    .ag-progress-bar {
      width: 100%; height: 4px; border-radius: 2px;
      cursor: pointer; appearance: none; -webkit-appearance: none; outline: none;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 4px rgba(189,0,255,0.15);
    }
    .ag-progress-bar::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px;
      background: linear-gradient(to right,
        #bd00ff var(--progress, 0%),
        rgba(255,255,255,0.08) var(--progress, 0%));
      box-shadow: 0 0 6px rgba(189,0,255,0.5);
    }
    .ag-progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: #bd00ff;
      border: 1.5px solid rgba(255,255,255,0.6);
      box-shadow: 0 0 6px rgba(189,0,255,0.9), 0 0 14px rgba(189,0,255,0.5);
      cursor: pointer; margin-top: -4px;
    }
    .ag-progress-times {
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(255,255,255,0.28);
      margin-top: 6px; letter-spacing: 0.04em;
    }

    .ag-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 36px; margin-top: 24px;
    }
    .ag-ctrl-btn {
      background: none; border: none; cursor: pointer; padding: 8px;
      color: rgba(255,255,255,0.5); line-height: 1;
      transition: color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .ag-ctrl-btn:hover { color: rgba(255,255,255,0.85); }
    .ag-ctrl-btn.ag-play-btn {
      width: 60px; height: 60px; border-radius: 50%;
      border: 1.5px solid rgba(189,0,255,0.5);
      color: rgba(189,0,255,0.9);
      box-shadow: 0 0 16px rgba(189,0,255,0.2);
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .ag-ctrl-btn.ag-play-btn:hover {
      border-color: rgba(189,0,255,0.9);
      box-shadow: 0 0 28px rgba(189,0,255,0.4);
      color: #bd00ff;
    }
    .ag-status-text {
      font-size: 12px; color: rgba(255,255,255,0.25);
      text-align: center; margin-top: 20px; letter-spacing: 0.06em;
    }
  </style>
</head>
<body class="ag-page">

  <header class="ag-inner-header">
    <a href="/home.html" class="ag-back-btn" aria-label="返回首頁">&#8592;</a>
    <img src="/assets/logo-transparent.png" alt="Afterglow" class="ag-inner-logo">
  </header>

  <div class="ag-page-title-block">
    <p class="ag-page-title"><strong>語音引導</strong> · VOICE GUIDE V1.0</p>
  </div>

  <div class="ag-main-scroll">
    <section class="ag-voice-player" aria-label="語音引導播放器">

      <div class="ag-orb-wrap" id="agOrbWrap" aria-hidden="true">
        <!-- Canvas: waveform drawn behind the ring -->
        <canvas id="agCanvas" width="260" height="260"></canvas>
        <!-- Static neon ring on top, black background masks canvas inside -->
        <div class="ag-orb-ring"></div>
      </div>

      <div class="ag-track-info">
        <p class="ag-track-title">MVP 引導</p>
        <p class="ag-track-hint">請戴上耳機，閉上眼睛</p>
      </div>

      <div class="ag-progress-wrap">
        <input type="range" class="ag-progress-bar" id="agProgressBar"
          min="0" max="100" value="0" step="0.1"
          aria-label="播放進度" style="--progress: 0%">
        <div class="ag-progress-times">
          <span id="agCurrentTime">0:00</span>
          <span id="agDuration">--:--</span>
        </div>
      </div>

      <div class="ag-controls">
        <button class="ag-ctrl-btn" id="agRewindBtn" aria-label="倒退 15 秒">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 5.5C9.306 5.5 5.5 9.306 5.5 14s3.806 8.5 8.5 8.5 8.5-3.806 8.5-8.5"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M14 5.5L11 3M14 5.5L11 8"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="15.5" text-anchor="middle" font-size="6.5"
              font-family="system-ui,sans-serif" font-weight="300" fill="currentColor">15</text>
          </svg>
        </button>

        <button class="ag-ctrl-btn ag-play-btn" id="agPlayBtn" aria-label="播放">
          <svg id="iconPlay" width="22" height="22" viewBox="0 0 22 22" fill="none">
            <polygon points="7,4 19,11 7,18" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg id="iconPause" width="22" height="22" viewBox="0 0 22 22" fill="none" style="display:none">
            <line x1="8" y1="4.5" x2="8" y2="17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="14" y1="4.5" x2="14" y2="17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg id="iconReplay" width="22" height="22" viewBox="0 0 22 22" fill="none" style="display:none">
            <path d="M11 4.5C7.41 4.5 4.5 7.41 4.5 11s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M11 4.5L8.5 2.5M11 4.5L8.5 6.5"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="ag-ctrl-btn" id="agForwardBtn" aria-label="快進 15 秒">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 5.5C18.694 5.5 22.5 9.306 22.5 14s-3.806 8.5-8.5 8.5S5.5 18.694 5.5 14"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M14 5.5L17 3M14 5.5L17 8"
              stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="15.5" text-anchor="middle" font-size="6.5"
              font-family="system-ui,sans-serif" font-weight="300" fill="currentColor">15</text>
          </svg>
        </button>
      </div>

      <p class="ag-status-text" id="agStatusText">點擊播放開始引導</p>

    </section>
  </div>

  <!-- No crossorigin here — we use a separate AudioContext fetch approach -->
  <audio id="agAudio" preload="metadata">
    <source src="/assets/audio/mvp-guide.mp3" type="audio/mpeg">
  </audio>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2025 Afterglow. All rights reserved.</p>
    </div>
  </footer>

  <script>
  /* ══════════════════════════════════════════════════════════════════════
     Circular waveform visualiser
     ──────────────────────────────────────────────────────────────────────
     Architecture:
       • Canvas (260×260) sits BEHIND the neon ring div
       • Ring div has background:#050505 — masks canvas inside the circle
       • Waveform is drawn ONLY in the annular band just outside the ring
         (inner radius = 71px, outer max = 71 + MAX_DISP px)
       • Web Audio: createMediaElementSource on the <audio> element
         — works on same-origin Vercel deployment without crossorigin attr
       • Fallback: animated sine wave when AudioContext unavailable
  ══════════════════════════════════════════════════════════════════════ */

    const audio        = document.getElementById('agAudio');
    const canvas       = document.getElementById('agCanvas');
    const ctx          = canvas.getContext('2d');
    const playBtn      = document.getElementById('agPlayBtn');
    const progressBar  = document.getElementById('agProgressBar');
    const currentTimeEl= document.getElementById('agCurrentTime');
    const durationEl   = document.getElementById('agDuration');
    const statusText   = document.getElementById('agStatusText');
    const rewindBtn    = document.getElementById('agRewindBtn');
    const forwardBtn   = document.getElementById('agForwardBtn');
    const iconPlay     = document.getElementById('iconPlay');
    const iconPause    = document.getElementById('iconPause');
    const iconReplay   = document.getElementById('iconReplay');

    /* Canvas logical size (matches HTML attrs) */
    const W = 260, H = 260;
    const CX = W / 2, CY = H / 2;
    const BASE_R   = 71;   /* just outside the 140px ring (70px radius + 1px border) */
    const MAX_DISP = 38;   /* max outward spike — larger = more visible */
    const N        = 24;   /* fewer points = smoother, more organic wave */
    const SMOOTH   = 0.82; /* high smoothing = slow, elegant motion */

    let audioCtx  = null;
    let analyser  = null;
    let tdBuf     = null;   /* time-domain byte buffer */
    let rafId     = null;
    let isPlaying = false;
    let smoothed  = new Float32Array(N); /* smoothed displacement per point */

    /* ── Icon helper ── */
    function showIcon(w) {
      iconPlay.style.display   = w === 'play'   ? '' : 'none';
      iconPause.style.display  = w === 'pause'  ? '' : 'none';
      iconReplay.style.display = w === 'replay' ? '' : 'none';
    }

    /* ── Time format ── */
    function fmt(s) {
      if (!isFinite(s)) return '--:--';
      return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
    }

    /* ── Init Web Audio (called on first user gesture) ── */
    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaElementSource(audio);
        analyser  = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.88; /* extra smoothing at analyser level */
        tdBuf = new Uint8Array(analyser.fftSize);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch(e) {
        console.warn('Web Audio unavailable, using fallback:', e);
        audioCtx = null;
      }
    }

    /* ── Draw one frame ── */
    function drawFrame(ts) {
      ctx.clearRect(0, 0, W, H);

      /* Read audio data or use fallback sine */
      const raw = new Float32Array(N);
      if (analyser && isPlaying) {
        /* Use frequency data (not time-domain):
           frequency bins are naturally smoother and represent energy,
           not raw waveform jitter. Take only the low-freq half for
           a calm, voice-like response. */
        analyser.getByteTimeDomainData(tdBuf);
        /* Sample N evenly-spaced points from the first 1/3 of the buffer
           (low-frequency region — voice fundamentals, no high-freq noise) */
        const usable = Math.floor(tdBuf.length / 3);
        const step   = Math.floor(usable / N);
        for (let i = 0; i < N; i++) {
          raw[i] = (tdBuf[i * step] - 128) / 128;
        }
      } else if (isPlaying) {
        /* Fallback: very slow, large-scale sine — 2 harmonics only */
        const t = ts / 1000;
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2;
          raw[i] = Math.sin(a * 2 + t * 0.8) * 0.55
                 + Math.sin(a * 3 - t * 0.5) * 0.25;
        }
      }
      /* else: raw stays 0 → wave collapses to base ring */

      /* Smooth */
      for (let i = 0; i < N; i++) {
        smoothed[i] = smoothed[i] * SMOOTH + raw[i] * (1 - SMOOTH);
      }

      /* Build polar points */
      const pts = [];
      for (let i = 0; i < N; i++) {
        const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
        const r = BASE_R + smoothed[i] * MAX_DISP;
        pts.push({ x: CX + r * Math.cos(angle), y: CY + r * Math.sin(angle) });
      }

      /* Draw smooth closed curve with Catmull-Rom tension */
      ctx.beginPath();
      const T = 0.3;
      for (let i = 0; i < N; i++) {
        const p0 = pts[(i - 1 + N) % N];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % N];
        const p3 = pts[(i + 2) % N];
        const c1x = p1.x + (p2.x - p0.x) * T;
        const c1y = p1.y + (p2.y - p0.y) * T;
        const c2x = p2.x - (p3.x - p1.x) * T;
        const c2y = p2.y - (p3.y - p1.y) * T;
        if (i === 0) ctx.moveTo(p1.x, p1.y);
        ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2.x, p2.y);
      }
      ctx.closePath();

      /* Neon stroke: 3 layers for tube glow effect */
      /* Layer 1: wide soft outer halo */
      ctx.shadowBlur  = 0;
      ctx.strokeStyle = 'rgba(189,0,255,0.12)';
      ctx.lineWidth   = 16;
      ctx.stroke();

      /* Layer 2: mid glow */
      ctx.shadowColor = '#bd00ff';
      ctx.shadowBlur  = 20;
      ctx.strokeStyle = 'rgba(189,0,255,0.5)';
      ctx.lineWidth   = 3;
      ctx.stroke();

      /* Layer 3: bright core line */
      ctx.shadowBlur  = 8;
      ctx.strokeStyle = 'rgba(230,140,255,0.95)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      ctx.shadowBlur = 0;

      if (isPlaying || smoothed.some(v => Math.abs(v) > 0.005)) {
        rafId = requestAnimationFrame(drawFrame);
      }
    }

    function startVis() {
      isPlaying = true;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(drawFrame);
    }

    function stopVis() {
      isPlaying = false;
      /* Let the loop run a bit longer to decay smoothly */
      if (!rafId) rafId = requestAnimationFrame(drawFrame);
    }

    /* ── Playback controls ── */
    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = fmt(audio.duration);
      progressBar.max = audio.duration;
    });

    playBtn.addEventListener('click', () => {
      if (audio.ended) audio.currentTime = 0;
      if (audio.paused) {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      showIcon('pause');
      playBtn.setAttribute('aria-label', '暫停');
      statusText.textContent = '引導進行中 · 放鬆呼吸';
      startVis();
    });

    audio.addEventListener('pause', () => {
      showIcon('play');
      playBtn.setAttribute('aria-label', '播放');
      statusText.textContent = audio.currentTime > 0 ? '已暫停' : '點擊播放開始引導';
      stopVis();
    });

    audio.addEventListener('ended', () => {
      showIcon('replay');
      playBtn.setAttribute('aria-label', '重新播放');
      statusText.textContent = '引導結束 · 慢慢回來';
      progressBar.value = 0;
      progressBar.style.setProperty('--progress', '0%');
      currentTimeEl.textContent = '0:00';
      stopVis();
    });

    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progressBar.value = audio.currentTime;
      progressBar.style.setProperty('--progress', pct.toFixed(1) + '%');
      currentTimeEl.textContent = fmt(audio.currentTime);
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
      const pct = audio.duration ? (progressBar.value / audio.duration) * 100 : 0;
      progressBar.style.setProperty('--progress', pct.toFixed(1) + '%');
    });

    rewindBtn.addEventListener('click',  () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
    forwardBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });
  </script>

</body>
