<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Afterglow｜讓夜裡的光有方向</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       home.html — Flexbox 文件流版本
       結構：body = flex column
         .ag-hero   (flex: 0 0 auto) — Logo + 副標
         .ag-cta    (flex: 0 0 auto) — 兩顆膠囊
         .ag-spacer (flex: 1 1 auto) — 吸收剩餘空間
         .ag-footer (flex: 0 0 auto) — 底部法律連結
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      min-height: 100svh;
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Flexbox 文件流 */
      display: flex;
      flex-direction: column;
      /* iOS Safe Area */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      overflow-x: hidden;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       A. HERO — Logo 偏左出血 + 副標靠右
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-hero {
      flex: 0 0 auto;
      position: relative;
      padding-top: 0; /* 上側出血：不需要 padding-top，讓 Logo 直接頂住 */
      overflow: visible; /* 讓 Logo 可以出血到 hero 外 */
    }

    /* Logo：明確破框 — 左、右、上三邊出血，讓裁切是刻意設計而非失誤 */
    .ag-logo {
      display: block;
      width: clamp(360px, 118vw, 580px); /* 比視窗更寬，左右都出血 */
      height: auto;
      margin-left: -10vw;  /* 左側出血 */
      margin-top: -32px;   /* 上側出血，切進 safe-area */
      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.65))
        drop-shadow(0 0 28px rgba(255,255,255,0.28))
        drop-shadow(0 0 60px rgba(255,255,255,0.12));
    }

    /* 副標群組：靠右，在 Logo 下方緊接 */
    .ag-text {
      padding: 12px 20px 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ag-subtitle {
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.5;
    }

    .ag-tagline {
      font-size: clamp(8px, 2vw, 9.5px);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.28);
      text-transform: uppercase;
      line-height: 1.4;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       B. CTA — 微錯落：主左次右
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-cta {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: clamp(28px, 6vh, 52px) 24px 0;
    }

    /* 共用膠囊基底 */
    .ag-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #fff;
      text-decoration: none;
      transition: box-shadow 0.35s ease, transform 0.30s ease;
    }

    /* 主 CTA：偏左，藍色 Glow */
    .ag-btn--primary {
      width: clamp(180px, 54vw, 220px);
      align-self: flex-start;
      margin-left: 4vw;
      border: 1.5px solid #00aaff;
      background: radial-gradient(ellipse at center, rgba(0,160,255,.18) 0%, transparent 70%);
      box-shadow:
        0 0 12px rgba(0,160,255,.45),
        inset 0 0 14px rgba(0,160,255,.20);
      animation: ag-breathe-blue 4s ease-in-out infinite;
      transform: rotate(-1.2deg);
    }

    .ag-btn--primary:hover,
    .ag-btn--primary:active {
      box-shadow:
        0 0 24px rgba(0,160,255,.72),
        inset 0 0 20px rgba(0,160,255,.32);
      transform: scale(1.03);
      animation: none;
    }

    /* 次 CTA：偏右，紅色 Glow */
    .ag-btn--secondary {
      width: clamp(160px, 50vw, 200px);
      align-self: flex-end;
      margin-right: 6vw;
      border: 1.5px solid rgba(255, 30, 60, 0.65);
      background: radial-gradient(ellipse at center, rgba(255,0,51,.10) 0%, transparent 70%);
      box-shadow:
        0 0 8px rgba(255,0,51,.25),
        inset 0 0 10px rgba(255,0,51,.12);
      color: rgba(255,255,255,0.78);
      font-weight: 400;
      transform: rotate(1.5deg);
    }

    .ag-btn--secondary:hover,
    .ag-btn--secondary:active {
      box-shadow:
        0 0 18px rgba(255,0,51,.52),
        inset 0 0 16px rgba(255,0,51,.22);
      transform: scale(1.03);
      color: #fff;
    }

    @keyframes ag-breathe-blue {
      0%, 100% {
        box-shadow: 0 0 12px rgba(0,160,255,.45), inset 0 0 14px rgba(0,160,255,.20);
      }
      50% {
        box-shadow: 0 0 20px rgba(0,160,255,.62), inset 0 0 18px rgba(0,160,255,.28);
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       C. SPACER — 吸收剩餘空間，把 Footer 推到底部
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* spacer-top: hero 與 CTA 之間，吸收 60% 剩餘空間，讓 CTA 往下移 */
    .ag-spacer-top {
      flex: 3 1 0;
      min-height: 16px;
    }
    /* spacer-bottom: CTA 與 footer 之間，吸收 40% 剩餘空間 */
    .ag-spacer {
      flex: 2 1 0;
      min-height: 16px;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       D. FOOTER — 文件流底部，iOS Safe Area 正確
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* footer uses global ag-footer-standard from layout.css */

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       桌機版微調（寬螢幕時讓 Logo 不要太大）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (min-width: 600px) {
      body {
        max-width: 480px;
        margin: 0 auto;
      }
      .ag-logo {
        /* 桌機：在 max-width 480px 容器內，左右出血相對容器 */
        width: clamp(360px, 108%, 560px);
        margin-left: -20px;
        margin-top: -24px;
      }
    }

    /* 極小螢幕（高度 < 680px）收緊 */
    @media (max-height: 680px) {
      .ag-hero { padding-top: 0; }
      .ag-logo { width: clamp(300px, 112vw, 440px); margin-top: -24px; }
      .ag-cta { padding-top: 20px; gap: 10px; }
      .ag-btn { height: 44px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Hero：Logo 偏左出血 -->
  <section class="ag-hero" aria-label="品牌識別">
    <img
      src="/assets/logo-transparent.png"
      alt="Afterglow"
      class="ag-logo"
    />
    <!-- 副標：靠右，在 Logo 下方 -->
    <div class="ag-text">
      <p class="ag-subtitle">讓夜裡的光有方向</p>
      <p class="ag-tagline">Stay Safe · Care for Yourself · Seek Help</p>
    </div>
  </section>

  <!-- Spacer：把 CTA 往下推 -->
  <div class="ag-spacer-top" aria-hidden="true"></div>

  <!-- CTA：微錯落，主左次右 -->
  <nav class="ag-cta" aria-label="主要功能入口">
    <a href="/menu.html" class="ag-btn ag-btn--primary">開始冥想</a>
    <a href="/support-main.html" class="ag-btn ag-btn--secondary">緊急支援</a>
  </nav>

  <!-- Spacer：把 Footer 推到底部 -->
  <div class="ag-spacer" aria-hidden="true"></div>

  <!-- Footer -->
  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2025 Afterglow. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
