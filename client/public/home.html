<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afterglow｜讓夜裡的光有方向</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <style>
    /* Home Specific Styles for Break-the-Window Design */
    .ag-home-header {
      position: relative;
      width: 100%;
      height: 40vh; /* Reduced height to push content down */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible; /* Allow logo to break out */
      margin-top: 5vh; /* Add top margin for breathing room */
    }

    .ag-logo-container {
      position: relative;
      width: 100%;
      max-width: 400px; /* Limit width for better control */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* The Large Logo */
    .ag-logo-large {
      width: 160%; /* Significantly larger to break boundaries */
      max-width: none;
      height: auto;
      transform: translateX(-5%) rotate(-8deg); /* More tilt */
      opacity: 1;
      flex-shrink: 0;
      margin-bottom: -20px;
    }

    /* Text Container aligned to bottom right of logo area */
    .ag-text-group {
      position: absolute;
      bottom: 15%;
      right: 0;
      text-align: right;
      z-index: 10;
      padding-right: 20px;
    }

    .ag-home-subtitle {
      font-size: 14px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 6px;
      font-weight: 400;
    }

    .ag-home-tagline-en {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    /* Adjust Main Content to sit below */
    .ag-home-main {
      margin-top: auto; /* Push to bottom of available space */
      margin-bottom: 32px; /* Ensure vertical spacing (Rule: >= 32px) */
      padding-top: 0;
      z-index: 20;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px; /* Increased space for breathing room */
      /* Removed flex-grow to prevent it from pushing footer out of view or misaligning */
      justify-content: flex-end; /* Push content towards bottom */
      padding-bottom: 20px; /* Add padding at bottom of main */
      width: 100%; /* Ensure full width for centering */
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      .ag-home-header {
        height: 40vh;
        align-items: center;
      }
      
      .ag-logo-container {
        max-width: 320px;
      }

      .ag-logo-large {
        width: 150%;
        transform: translateX(-5%) rotate(-8deg);
        margin-bottom: 0;
      }
      
      .ag-text-group {
        bottom: 10%;
        right: 10px;
      }

      .ag-home-subtitle {
        font-size: 12px;
      }

      .ag-home-tagline-en {
        font-size: 9px;
      }
      
      .ag-home-main {
        margin-top: auto;
        margin-bottom: 20px;
        gap: 24px;
      }
    }

  </style>
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</head>
<body>
  <div class="ag-page">
    <div class="ag-main-scroll">
      <!-- Header：Break-the-Window Logo Design -->
      <header class="ag-home-header">
        <div class="ag-logo-container">
          <img src="/assets/logo-new.png" class="ag-logo-large" alt="Afterglow">
          
          <div class="ag-text-group">
            <div class="ag-home-subtitle">讓夜裡的光有方向</div>
            <div class="ag-home-tagline-en">STAY SAFE · CARE FOR YOURSELF · SEEK HELP</div>
          </div>
        </div>
      </header>

      <!-- Main：兩顆 Glow 膠囊 -->
      <main class="ag-home-main">
        <a href="/menu.html" class="ag-capsule ag-capsule--primary">
          開始冥想
        </a>

        <!-- 更新連結：直接進入選單，因為已在 gate.html 同意過免責聲明 -->
        <a href="/support-main.html" class="ag-capsule ag-capsule--secondary">
          緊急支援
        </a>
      </main>

      <!-- Footer：共用模組 -->
      <footer class="ag-footer-v2 ag-footer-single" style="margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="ag-footer-v2__links">
          <a href="/privacy.html" class="ag-footer-v2__link">隱私權</a>
          <span class="ag-footer-v2__separator">|</span>
          <a href="/legal.html" class="ag-footer-v2__link">免責</a>
          <span class="ag-footer-v2__separator">|</span>
          <a href="/terms.html" class="ag-footer-v2__link">條款</a>
          <span class="ag-footer-v2__separator">|</span>
          <a href="/about.html" class="ag-footer-v2__link">關於</a>
        </div>
        <div class="ag-footer-v2__copyright">© 2025 Afterglow</div>
      </footer>
    </div>
  </div>
</body>
</html>
