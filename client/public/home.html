<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Afterglow｜讓夜裡的光有方向</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       home.html — App Shell 版本
       首屏：100svh，overflow hidden
       結構：
         .ag-screen  — 首屏容器（100svh，flex column）
           .ag-bg-logo  — 背景層 Logo（position absolute）
           .ag-body     — 前景層（flex: 1，flex column，z-index 1）
             .ag-prompt   — 中文問句（主體）
             .ag-cta      — 兩顆按鈕
         .ag-below   — 首屏以下（Footer 等次要資訊）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      /* iOS Safe Area */
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       A. 首屏容器 — 100svh，鎖住捲動
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-screen {
      position: relative;
      width: 100%;
      height: 100svh;           /* 使用 svh 避免 iOS Safari 底部 bar 問題 */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       B. 背景層 Logo — 氣氛層，不是主角
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-bg-logo {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;     /* 不攔截點擊 */
      width: 100%;
      overflow: hidden;
    }

    .ag-logo {
      display: block;
      width: clamp(280px, 90vw, 420px);   /* 縮小至約 75% */
      height: auto;
      margin-left: -8vw;        /* 左側出血 */
      margin-top: -20px;        /* 上側出血 */
      opacity: 0.72;            /* 降低主導性，退為背景氣氛 */
      cursor: pointer;
      pointer-events: auto;     /* Logo 本身仍可點擊重播動畫 */
      filter:
        drop-shadow(0 0 0.5px rgba(255,255,255,0.90))
        drop-shadow(0 0 3px rgba(255,255,255,0.22))
        drop-shadow(0 0 8px rgba(255,255,255,0.08))
        drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6));
      -webkit-font-smoothing: antialiased;
    }

    /* Logo 通電動畫 — 切分音節奏，前長後急 */
    @keyframes agLogoIgnite {
      0%   { opacity: 0.08; filter: drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      45%  { opacity: 0.08; filter: drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      49%  { opacity: 0.55; filter: drop-shadow(0 0 1px rgba(255,255,255,0.65)) drop-shadow(0 0 3px rgba(255,255,255,0.18)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      58%  { opacity: 0.55; filter: drop-shadow(0 0 1px rgba(255,255,255,0.65)) drop-shadow(0 0 3px rgba(255,255,255,0.18)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      60%  { opacity: 0.04; filter: drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      65%  { opacity: 0.72; filter: drop-shadow(0 0 0.5px rgba(255,255,255,0.90)) drop-shadow(0 0 3px rgba(255,255,255,0.22)) drop-shadow(0 0 8px rgba(255,255,255,0.08)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      100% { opacity: 0.72; filter: drop-shadow(0 0 0.5px rgba(255,255,255,0.90)) drop-shadow(0 0 3px rgba(255,255,255,0.22)) drop-shadow(0 0 8px rgba(255,255,255,0.08)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
    }

    .ag-logo--igniting {
      animation: agLogoIgnite 1.4s ease-out 1 forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .ag-logo, .ag-logo--igniting {
        animation: none;
        opacity: 0.72;
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       C. 前景層 — 問句 + 按鈕，z-index 1
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-body {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;  /* 問句 + 按鈕靠下，Logo 佔上方 */
      padding: 0 28px clamp(32px, 8vh, 64px);
      gap: clamp(28px, 6vh, 48px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       D. 問句區 — 首屏主體文字
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-prompt {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ag-prompt__line1 {
      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
    }

    .ag-prompt__line2 {
      font-size: clamp(20px, 5.5vw, 26px);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.4;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       E. 按鈕區 — App 核心入口，同寬，微錯落
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-cta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 共用膠囊基底 */
    .ag-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;              /* 同寬 */
      height: 52px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.10em;
      color: #fff;
      text-decoration: none;
      transition: box-shadow 0.35s ease, transform 0.25s ease;
    }

    /* 主 CTA：藍色，微左偏 */
    .ag-btn--primary {
      margin-left: -4px;
      border: 1.5px solid #00aaff;
      background: radial-gradient(ellipse at center, rgba(0,160,255,.16) 0%, transparent 70%);
      box-shadow:
        0 0 12px rgba(0,160,255,.40),
        inset 0 0 12px rgba(0,160,255,.18);
      animation: ag-breathe-blue 4s ease-in-out infinite;
    }

    .ag-btn--primary:hover,
    .ag-btn--primary:active {
      box-shadow:
        0 0 22px rgba(0,160,255,.68),
        inset 0 0 18px rgba(0,160,255,.28);
      transform: scale(1.02);
      animation: none;
    }

    /* 次 CTA：紅色，微右偏 */
    .ag-btn--secondary {
      margin-right: -4px;
      border: 1.5px solid rgba(255, 30, 60, 0.60);
      background: radial-gradient(ellipse at center, rgba(255,0,51,.08) 0%, transparent 70%);
      box-shadow:
        0 0 8px rgba(255,0,51,.22),
        inset 0 0 8px rgba(255,0,51,.10);
      color: rgba(255,255,255,0.75);
      font-weight: 400;
    }

    .ag-btn--secondary:hover,
    .ag-btn--secondary:active {
      box-shadow:
        0 0 16px rgba(255,0,51,.48),
        inset 0 0 14px rgba(255,0,51,.20);
      transform: scale(1.02);
      color: #fff;
    }

    @keyframes ag-breathe-blue {
      0%, 100% { box-shadow: 0 0 12px rgba(0,160,255,.40), inset 0 0 12px rgba(0,160,255,.18); }
      50%       { box-shadow: 0 0 20px rgba(0,160,255,.58), inset 0 0 16px rgba(0,160,255,.26); }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       F. 首屏以下 — Footer 等次要資訊
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-below {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       桌機版微調
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (min-width: 600px) {
      body {
        max-width: 480px;
        margin: 0 auto;
      }
      .ag-logo {
        width: clamp(260px, 85%, 380px);
        margin-left: -16px;
        margin-top: -16px;
      }
      .ag-body {
        padding-left: 36px;
        padding-right: 36px;
      }
    }

    /* 極小螢幕（高度 < 680px）收緊 */
    @media (max-height: 680px) {
      .ag-logo { width: clamp(220px, 80vw, 320px); margin-top: -12px; }
      .ag-body { gap: 20px; padding-bottom: 24px; }
      .ag-btn { height: 46px; font-size: 14px; }
      .ag-prompt__line2 { font-size: clamp(18px, 5vw, 22px); }
    }
  </style>
</head>
<body>

  <!-- 首屏：100svh，Logo 背景層 + 問句前景層 -->
  <div class="ag-screen">

    <!-- 背景層：Logo 氣氛 -->
    <div class="ag-bg-logo" aria-hidden="true">
      <img
        src="/assets/logo-handwritten-nobg.png"
        alt=""
        class="ag-logo ag-logo--igniting"
        id="ag-logo-el"
      />
    </div>

    <!-- 前景層：問句 + 按鈕 -->
    <div class="ag-body">

      <!-- 問句：首屏主體 -->
      <div class="ag-prompt">
        <p class="ag-prompt__line1">派對之後，天亮之前</p>
        <p class="ag-prompt__line2">讓黑夜裡的光有方向</p>
        <p class="ag-prompt__line1" style="margin-top:10px;">選一個比較接近你現在的狀態</p>
      </div>

      <!-- 按鈕：App 核心入口 -->
      <nav class="ag-cta" aria-label="主要功能入口">
        <a href="/menu.html" class="ag-btn ag-btn--primary">我需要重新開機</a>
        <a href="/support-main.html" class="ag-btn ag-btn--secondary">我需要緊急協助</a>
      </nav>

    </div>
  </div>

  <!-- 首屏以下：Footer 次要資訊 -->
  <div class="ag-below">
    <footer class="ag-footer-standard">
      <div class="ag-footer__inner">
        <nav class="ag-footer__links" aria-label="Legal and info links">
          <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
          <span class="ag-footer__separator">•</span>
          <a href="/legal.html" class="ag-footer__link">法律免責</a>
          <span class="ag-footer__separator">•</span>
          <a href="/terms.html" class="ag-footer__link">使用條款</a>
          <span class="ag-footer__separator">•</span>
          <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
        </nav>
        <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      var logo = document.getElementById('ag-logo-el');
      if (!logo) return;

      /* 點擊 Logo 重播通電動畫 */
      function reIgnite() {
        logo.classList.remove('ag-logo--igniting');
        void logo.offsetWidth;   /* 強制 reflow */
        logo.classList.add('ag-logo--igniting');
      }

      logo.addEventListener('click', reIgnite);
      logo.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') reIgnite();
      });
    })();
  </script>
</body>
</html>
