<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Afterglow｜讓夜裡的光有方向</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       home.html — Flexbox 文件流版本
       結構：body = flex column
         .ag-hero   (flex: 0 0 auto) — Logo + 副標
         .ag-cta    (flex: 0 0 auto) — 兩顆膠囊
         .ag-spacer (flex: 1 1 auto) — 吸收剩餘空間
         .ag-footer (flex: 0 0 auto) — 底部法律連結
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      height: 100dvh;          /* Full viewport height */
      overflow: hidden;        /* App Shell: lock body scroll */
      background: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Flexbox 文件流 */
      display: flex;
      flex-direction: column;
      /* iOS Safe Area */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: 0;       /* footer handles safe-area-inset-bottom itself */
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       A. HERO — Logo 偏左出血 + 副標靠右
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-hero {
      flex: 0 0 auto;
      position: relative;
      padding-top: 0; /* 上側出血：不需要 padding-top，讓 Logo 直接頂住 */
      overflow: visible; /* 讓 Logo 可以出血到 hero 外 */
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       Afterglow Logo — 極簡通電動畫
       原則：字是主角，光是配角
       筆劃錐利、光暈極薄、不模糊、不白霧
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /*
     * Logo 通電動畫設計原則：
     * 模擬螢光燈管剛通電的物理行為：
     *   1. 初始微暗（燈絲預熱）
     *   2. 一次輕微的亮度跳升（第一次放電嘗試）
     *   3. 極短暫收回（放電不穩定）
     *   4. 穩定點亮（等離子體建立）
     * 節奏短、克制、有物理感，不戲劇化
     */
    /*
     * agLogoIgnite — 長短短三次放電
     * 前段長暗（燈絲預熱）→ 長閃（第一次，持續較長）→ 消
     * → 短閃（第二次）→ 消 → 短閃（第三次）→ 穩定點亮
     * 總時長 2.2s
     */
    @keyframes agLogoIgnite {
      /* 前段：長暗，燈絲預熱 */
      0%   { opacity: 0.06; filter: blur(2.0px) drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      30%  { opacity: 0.06; filter: blur(2.0px) drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }

      /* 第一次：長閃，持續較長 */
      34%  { opacity: 0.55; filter: blur(1.4px) drop-shadow(0 0 1px rgba(255,255,255,0.65)) drop-shadow(0 0 4px rgba(255,255,255,0.22)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      44%  { opacity: 0.55; filter: blur(1.4px) drop-shadow(0 0 1px rgba(255,255,255,0.65)) drop-shadow(0 0 4px rgba(255,255,255,0.22)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      47%  { opacity: 0.04; filter: blur(2.0px) drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }

      /* 第二次：短閃，快 */
      51%  { opacity: 0.70; filter: blur(1.2px) drop-shadow(0 0 1px rgba(255,255,255,0.80)) drop-shadow(0 0 5px rgba(255,255,255,0.28)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      55%  { opacity: 0.70; filter: blur(1.2px) drop-shadow(0 0 1px rgba(255,255,255,0.80)) drop-shadow(0 0 5px rgba(255,255,255,0.28)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      57%  { opacity: 0.03; filter: blur(2.0px) drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }

      /* 第三次：短閃，更快 */
      60%  { opacity: 0.85; filter: blur(1.0px) drop-shadow(0 0 1px rgba(255,255,255,0.90)) drop-shadow(0 0 6px rgba(255,255,255,0.35)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      63%  { opacity: 0.85; filter: blur(1.0px) drop-shadow(0 0 1px rgba(255,255,255,0.90)) drop-shadow(0 0 6px rgba(255,255,255,0.35)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      65%  { opacity: 0.03; filter: blur(2.0px) drop-shadow(0 0 0px rgba(255,255,255,0)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }

      /* 穩定點亮：急促到位，緩慢收斂 */
      70%  { opacity: 0.50; filter: blur(1.2px) drop-shadow(0 0 1px rgba(255,255,255,0.80)) drop-shadow(0 0 5px rgba(255,255,255,0.28)) drop-shadow(0 0 12px rgba(255,255,255,0.10)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
      100% { opacity: 0.50; filter: blur(1.2px) drop-shadow(0 0 1px rgba(255,255,255,0.80)) drop-shadow(0 0 5px rgba(255,255,255,0.28)) drop-shadow(0 0 12px rgba(255,255,255,0.10)) drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6)); }
    }

    /* Logo：明確破框 — 左、右、上三邊出血，讓裁切是刻意設計而非失誤 */
    .ag-logo {
      display: block;
      width: clamp(360px, 118vw, 580px);
      height: auto;
      margin-left: -10vw;
      margin-top: -32px;
      cursor: pointer;
      /* 靜止態：退到背景，比前景暗，加模糊強化遠景感 */
      opacity: 0.50;
      filter:
        blur(1.2px)
        drop-shadow(0 0 1px rgba(255,255,255,0.80))
        drop-shadow(0 0 5px rgba(255,255,255,0.28))
        drop-shadow(0 0 12px rgba(255,255,255,0.10))
        drop-shadow(0.5px 1px 0px rgba(0,0,0,0.6));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .ag-logo--igniting {
      animation: agLogoIgnite 2.2s ease-out 1 forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .ag-logo, .ag-logo--igniting {
        animation: none;
        opacity: 0.50;
      }
    }

    /* 副標群組：靠右，在 Logo 下方緊接，跟著 Logo 淡入 */
    @keyframes agFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .ag-text {
      padding: 12px 20px 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      animation: agFadeIn 1.2s ease-out 1.0s 1 forwards;
    }

    .ag-subtitle {
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.5;
    }

    .ag-tagline {
      font-size: clamp(8px, 2vw, 9.5px);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.28);
      text-transform: uppercase;
      line-height: 1.4;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       B. CONTEXT — 副標下、膠囊上的引導文案
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-context {
      flex: 0 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /*
     * agContextGlow — 極慢純淡入，無位移無模糊
     * 像光慢慢夠了，文字一直都在那裡
     * 第一行 delay 2.4s（Logo 長短短結束後），第二行 delay 3.6s
     */
    @keyframes agContextGlow {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .ag-context__title {
      font-size: clamp(15px, 3.8vw, 18px);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(255,255,255,0.08);
      opacity: 0;
      animation: agContextGlow 1.8s ease-out 2.4s 1 forwards;
    }

    .ag-context__hint {
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 300;
      letter-spacing: 0.10em;
      color: rgba(255, 255, 255, 0.42);
      line-height: 1.5;
      text-shadow: 0 0 20px rgba(255,255,255,0.06);
      opacity: 0;
      animation: agContextGlow 3.5s ease-in 3.6s 1 forwards;
    }

    /* 偏好減少動態：直接顯示，不動畫 */
    @media (prefers-reduced-motion: reduce) {
      .ag-context__title,
      .ag-context__hint {
        animation: none;
        opacity: 1;
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       C. CTA — 微錯落：主左次右
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .ag-cta {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: clamp(28px, 6vh, 52px) 24px 0;
    }

    /* 共用膠囊基底 */
    .ag-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #fff;
      text-decoration: none;
      transition: box-shadow 0.35s ease, transform 0.30s ease;
    }

    /* 主 CTA：偏左，藍色 Glow，最先出現 */
    .ag-btn--primary {
      width: clamp(180px, 54vw, 220px);
      align-self: flex-start;
      margin-left: 4vw;
      border: 1.5px solid #00aaff;
      background: radial-gradient(ellipse at center, rgba(0,160,255,.22) 0%, transparent 70%);
      box-shadow:
        0 0 14px rgba(0,160,255,.54),
        0 0 28px rgba(0,160,255,.18),
        inset 0 0 16px rgba(0,160,255,.24);
      transform: rotate(-1.2deg);
      opacity: 0;
      animation: agFadeIn 0.6s ease-out 0.3s 1 forwards, ag-breathe-blue 4s ease-in-out 1.0s infinite;
    }

    .ag-btn--primary:hover,
    .ag-btn--primary:active {
      opacity: 1; /* 防止 animation:none 後回到初始 opacity:0 */
      box-shadow:
        0 0 24px rgba(0,160,255,.72),
        inset 0 0 20px rgba(0,160,255,.32);
      transform: scale(1.03);
      animation: none;
    }

    /* 次 CTA：偏右，紅色 Glow，藍色後 0.5s 出現 */
    .ag-btn--secondary {
      width: clamp(160px, 50vw, 200px);
      align-self: flex-end;
      margin-right: 6vw;
      border: 1.5px solid rgba(255, 30, 60, 0.75);
      background: radial-gradient(ellipse at center, rgba(255,0,51,.13) 0%, transparent 70%);
      box-shadow:
        0 0 10px rgba(255,0,51,.30),
        0 0 22px rgba(255,0,51,.10),
        inset 0 0 12px rgba(255,0,51,.15);
      color: rgba(255,255,255,0.82);
      font-weight: 400;
      transform: rotate(1.5deg);
      opacity: 0;
      animation: agFadeIn 0.7s ease-out 0.8s 1 forwards;
    }

    .ag-btn--secondary:hover,
    .ag-btn--secondary:active {
      box-shadow:
        0 0 18px rgba(255,0,51,.52),
        inset 0 0 16px rgba(255,0,51,.22);
      transform: scale(1.03);
      color: #fff;
    }

    @keyframes ag-breathe-blue {
      0%, 100% {
        box-shadow: 0 0 14px rgba(0,160,255,.54), 0 0 28px rgba(0,160,255,.18), inset 0 0 16px rgba(0,160,255,.24);
      }
      50% {
        box-shadow: 0 0 22px rgba(0,160,255,.70), 0 0 36px rgba(0,160,255,.24), inset 0 0 20px rgba(0,160,255,.32);
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       C. SPACER — 吸收剩餘空間，把 Footer 推到底部
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* spacer-top: hero 與 context 之間，吸收上段空間，讓文案 + 膠囊往下移 */
    .ag-spacer-top {
      flex: 4 1 0;
      min-height: 20px;
    }
    /* spacer-mid: context 與 CTA 之間 */
    .ag-spacer-mid {
      flex: 0 0 20px;
      min-height: 0;
    }
    /* spacer-bottom: CTA 與 footer 之間 */
    .ag-spacer {
      flex: 2 1 0;
      min-height: 16px;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       D. FOOTER — 文件流底部，iOS Safe Area 正確
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    /* footer uses global ag-footer-standard from layout.css */

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       桌機版微調（寬螢幕時讓 Logo 不要太大）
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (min-width: 600px) {
      body {
        max-width: 480px;
        margin: 0 auto;
      }
      .ag-logo {
        /* 桌機：在 max-width 480px 容器內，左右出血相對容器 */
        width: clamp(360px, 108%, 560px);
        margin-left: -20px;
        margin-top: -24px;
      }
    }

    /* 極小螢幕（高度 < 680px）收緊 */
    @media (max-height: 680px) {
      .ag-hero { padding-top: 0; }
      .ag-logo { width: clamp(300px, 112vw, 440px); margin-top: -24px; }
      .ag-cta { padding-top: 20px; gap: 10px; }
      .ag-btn { height: 44px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Hero：Logo 偏左出血 -->
  <section class="ag-hero" aria-label="品牌識別">
    <img
      src="/assets/logo-handwritten-nobg.png"
      alt="Afterglow"
      class="ag-logo ag-logo--igniting"
      role="button"
      tabindex="0"
      aria-label="Afterglow 首頁"
    />
    <!-- 副標：靠右，在 Logo 下方 -->
    <div class="ag-text">
      <p class="ag-subtitle">讓夜裡的光有方向</p>
      <p class="ag-tagline">Stay Safe · Care for Yourself · Seek Help</p>
    </div>
  </section>

  <!-- Spacer：把文案往下推 -->
  <div class="ag-spacer-top" aria-hidden="true"></div>

  <!-- 引導文案：副標下、膠囊上 -->
  <div class="ag-context">
    <p class="ag-context__title">派對之後，天亮之前</p>
    <p class="ag-context__hint">選一個比較接近你現在的狀態</p>
  </div>

  <!-- Spacer：context 與 CTA 之間 -->
  <div class="ag-spacer-mid" aria-hidden="true"></div>

  <!-- CTA：微錯落，主左次右 -->
  <nav class="ag-cta" aria-label="主要功能入口">
    <a href="/menu.html" class="ag-btn ag-btn--primary">我需要重新開機</a>
    <a href="/support-main.html" class="ag-btn ag-btn--secondary">我需要緊急協助</a>
  </nav>

  <!-- Spacer：把 Footer 推到底部 -->
  <div class="ag-spacer" aria-hidden="true"></div>

  <!-- Footer -->
  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var logo = document.querySelector('.ag-logo');
      if (!logo) return;

      /* 點擊重播：移除 class → 強制 reflow → 重新加回 */
      function reIgnite(e) {
        /* 阻止預設行為（img 無預設，但保持乾淨） */
        logo.classList.remove('ag-logo--igniting');
        /* 強制瀏覽器重新計算，確保 animation 重播 */
        void logo.offsetWidth;
        logo.classList.add('ag-logo--igniting');
      }

      logo.addEventListener('click', reIgnite);
      logo.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') reIgnite(e);
      });
    })();
