<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Afterglow｜讓夜裡的光有方向</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</head>
<body>
  <div class="ag-page">
    <!-- A. Neon Back Button (Icon Only) -->
    <button class="ag-back-button" onclick="window.location.href='/'" aria-label="返回首頁"></button>

    <!-- Main Scrollable Area -->
    <div class="ag-main-scroll">
      
      <!-- B. Hero Section (Logo + Subtitle) -->
      <header class="ag-home-header">
        <div class="ag-logo-container">
          <img src="/assets/logo-new.png" alt="Afterglow Logo" class="ag-logo-large" />
        </div>
        
        <div class="ag-text-group">
          <h2 class="ag-home-subtitle">讓夜裡的光有方向</h2>
          <p class="ag-home-tagline-en">STAY SAFE · CARE FOR YOURSELF · SEEK HELP</p>
        </div>
      </header>

      <!-- C. Main Interaction Area (Vertical Capsules) -->
      <main class="ag-home-main">
        <div class="ag-pills-container">
          <!-- Blue Pill: Start Meditation -->
          <a href="/menu.html" class="ag-capsule ag-capsule--primary">
            開始冥想
          </a>
          
          <!-- Red Pill: Emergency Support -->
          <a href="/support-main.html" class="ag-capsule ag-capsule--secondary">
            緊急支援
          </a>
        </div>

        <!-- D. Footer (Clean & Minimal) -->
        <footer class="ag-footer-standard">
          <div class="ag-footer__inner">
            <div class="ag-footer__links">
              <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
              <span class="ag-footer__separator">|</span>
              <a href="/legal.html" class="ag-footer__link">法律免責</a>
              <span class="ag-footer__separator">|</span>
              <a href="/terms.html" class="ag-footer__link">使用條款</a>
              <span class="ag-footer__separator">|</span>
              <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
            </div>
            <div class="ag-footer__copyright">
              &copy; 2025 Afterglow. All rights reserved.
            </div>
          </div>
        </footer>
      </main>

    </div>
  </div>
</body>
</html>
