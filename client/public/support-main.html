<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* Flexbox Sticky Footer Structure */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #050505;
    }
    .ag-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    .ag-main-scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .ag-support-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* Center vertically to balance space */
      padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
      box-sizing: border-box;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .ag-wild-header {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }

    /* Organic, slightly staggered buttons */
    .ag-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      border-radius: 32px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* 急救指引 - 藍綠色 Glow */
    .ag-menu-button--first-aid {
      width: 210px;
      transform: translateX(-5px) rotate(-0.5deg);
      border: 2px solid #00e5ff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3), inset 0 0 8px rgba(0, 229, 255, 0.1);
      color: #e0ffff;
    }
    .ag-menu-button--first-aid:hover, .ag-menu-button--first-aid:active {
      transform: translateX(-5px) rotate(-0.5deg) scale(1.02);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), inset 0 0 12px rgba(0, 229, 255, 0.2);
      background: rgba(0, 229, 255, 0.15);
    }

    /* 風險計算器 - 桃紅色 Glow */
    .ag-menu-button--risk {
      width: 220px;
      transform: translateX(8px) rotate(0.8deg);
      border: 2px solid #ff6bd9;
      box-shadow: 0 0 12px rgba(255, 107, 217, 0.3), inset 0 0 8px rgba(255, 107, 217, 0.1);
      color: #ffe0f5;
    }
    .ag-menu-button--risk:hover, .ag-menu-button--risk:active {
      transform: translateX(8px) rotate(0.8deg) scale(1.02);
      box-shadow: 0 0 20px rgba(255, 107, 217, 0.6), inset 0 0 12px rgba(255, 107, 217, 0.2);
      background: rgba(255, 107, 217, 0.15);
    }

    /* 權利知識 - 紫色 Glow */
    .ag-menu-button--rights {
      width: 205px;
      transform: translateX(-6px) rotate(-0.6deg);
      border: 2px solid #bd00ff;
      box-shadow: 0 0 12px rgba(189, 0, 255, 0.3), inset 0 0 8px rgba(189, 0, 255, 0.1);
      color: #f0e0ff;
    }
    .ag-menu-button--rights:hover, .ag-menu-button--rights:active {
      transform: translateX(-6px) rotate(-0.6deg) scale(1.02);
      box-shadow: 0 0 20px rgba(189, 0, 255, 0.6), inset 0 0 12px rgba(189, 0, 255, 0.2);
      background: rgba(189, 0, 255, 0.15);
    }

    /* 求助資源 - 綠色 Glow */
    .ag-menu-button--help {
      width: 215px;
      transform: translateX(4px) rotate(0.4deg);
      border: 2px solid #00ff88;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.3), inset 0 0 8px rgba(0, 255, 136, 0.1);
      color: #e0ffe0;
    }
    .ag-menu-button--help:hover, .ag-menu-button--help:active {
      transform: translateX(4px) rotate(0.4deg) scale(1.02);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), inset 0 0 12px rgba(0, 255, 136, 0.2);
      background: rgba(0, 255, 136, 0.15);
    }

    /* Minimal Footer Adjustments */
    .ag-footer-minimal {
      margin-top: auto;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.5);
    }
    .ag-footer-minimal__copyright {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
    }

    /* Mobile Responsive Overrides */
    @media (max-width: 430px) {
      .ag-support-menu {
        gap: 16px;
        padding-top: calc(10px + env(safe-area-inset-top));
      }
      .ag-menu-button {
        height: 58px;
        font-size: 17px;
      }
      .ag-menu-button--first-aid { width: min(82vw, 210px); }
      .ag-menu-button--risk { width: min(86vw, 220px); }
      .ag-menu-button--rights { width: min(80vw, 205px); }
      .ag-menu-button--help { width: min(84vw, 215px); }
      
      .ag-footer-minimal {
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }
      .ag-footer-minimal__copyright {
        font-size: 11px;
      }
    }
  </style>
</head>
<body class="ag-page">
  <!-- Back Button (Fixed Position) -->
  <a href="/home.html" class="ag-back-button neon-style" aria-label="返回">
    <span class="ag-neon-icon-back"></span>
  </a>

  <div class="ag-main-scroll">
    <div class="ag-support-menu">
        
        <!-- Compact Header -->
        <div class="ag-wild-header">
          <a href="/home.html">
            <img src="/assets/logo-handwritten.png" class="ag-wild-logo" alt="Afterglow" style="width: 120px; opacity: 0.85; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));">
          </a>
        </div>

        <!-- 急救指引 -->
        <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">
          急救指引
        </a>

        <!-- 風險計算器 -->
        <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">
          風險計算器
        </a>

        <!-- 權利知識 -->
        <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">
          權利知識
        </a>

        <!-- 求助資源 -->
        <a href="/help.html" class="ag-menu-button ag-menu-button--help">
          求助資源
        </a>

    </div>

    <!-- Minimal Footer -->
    <footer class="ag-footer-minimal">
      <div class="ag-footer-minimal__copyright">
        &copy; 2025 Afterglow. All rights reserved.
      </div>
    </footer>
  </div>
</body>
</html>
