<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       Support Main Layout - Flexbox Structure
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
    }

    .ag-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Header: Logo Area */
    .ag-header {
      position: relative;
      padding: calc(18px + env(safe-area-inset-top)) 20px 8px;
      min-height: 96px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .ag-logo-link {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      left: 20px;
      z-index: 3;
      display: inline-flex;
      text-decoration: none;
    }

    .ag-logo {
      display: block;
      width: 110px;
      max-width: 32vw;
      height: auto;
    }

    /* Main: Capsule Content Area */
    .ag-main-scroll {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 20px 24px;
      box-sizing: border-box;
    }

    .ag-support-inner {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Capsule Container */
    .ag-capsule-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin: 0 auto;
    }

    /* Base Capsule Style */
    .ag-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 60px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      transition: 0.3s ease;
      position: relative;
      background: rgba(0, 0, 0, 0.3);
      margin: 0 auto;
    }

    /* Playful Stagger Effect */
    .ag-menu-button:nth-child(1) { transform: translateX(6px); }
    .ag-menu-button:nth-child(2) { transform: translateX(-10px); }
    .ag-menu-button:nth-child(3) { transform: translateX(-2px); }
    .ag-menu-button:nth-child(4) { transform: translateX(10px); }

    /* 急救指引 - 藍綠色 Glow */
    .ag-menu-button--first-aid {
      border: 2px solid #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.1);
      color: #e0ffff;
    }
    .ag-menu-button--first-aid:hover {
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.7), inset 0 0 15px rgba(0, 229, 255, 0.2);
      background: rgba(0, 229, 255, 0.1);
    }

    /* 風險計算器 - 桃紅色 Glow */
    .ag-menu-button--risk {
      border: 2px solid #ff6bd9;
      box-shadow: 0 0 15px rgba(255, 107, 217, 0.4), inset 0 0 10px rgba(255, 107, 217, 0.1);
      color: #ffe0f5;
    }
    .ag-menu-button--risk:hover {
      box-shadow: 0 0 25px rgba(255, 107, 217, 0.7), inset 0 0 15px rgba(255, 107, 217, 0.2);
      background: rgba(255, 107, 217, 0.1);
    }

    /* 權利知識 - 紫色 Glow */
    .ag-menu-button--rights {
      border: 2px solid #bd00ff;
      box-shadow: 0 0 15px rgba(189, 0, 255, 0.4), inset 0 0 10px rgba(189, 0, 255, 0.1);
      color: #f0e0ff;
    }
    .ag-menu-button--rights:hover {
      box-shadow: 0 0 25px rgba(189, 0, 255, 0.7), inset 0 0 15px rgba(189, 0, 255, 0.2);
      background: rgba(189, 0, 255, 0.1);
    }

    /* 求助資源 - 綠色 Glow */
    .ag-menu-button--help {
      border: 2px solid #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4), inset 0 0 10px rgba(0, 255, 136, 0.1);
      color: #e0ffe0;
    }
    .ag-menu-button--help:hover {
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.7), inset 0 0 15px rgba(0, 255, 136, 0.2);
      background: rgba(0, 255, 136, 0.1);
    }

    /* Footer */
    .ag-footer {
      flex-shrink: 0;
      padding: 16px 20px calc(18px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .ag-footer-standard {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      position: relative;
      z-index: 10;
    }

    .ag-footer__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .ag-footer__links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 12px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      width: 100%;
    }

    .ag-footer__link {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .ag-footer__link:hover {
      color: #fff;
      opacity: 1;
    }

    .ag-footer__separator {
      color: inherit;
      font-size: 10px;
      opacity: 0.5;
    }

    .ag-footer__copyright {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body class="ag-page">
    <!-- Header: Logo Area -->
    <header class="ag-header">
      <a href="/home.html" class="ag-logo-link" aria-label="返回首頁">
        <img src="/assets/logo-handwritten.png" class="ag-logo" alt="Afterglow">
      </a>
    </header>

    <!-- Main: Capsule Content Area -->
    <main class="ag-main-scroll">
      <div class="ag-support-inner">
        <div class="ag-capsule-list">
          <!-- 急救指引 -->
          <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">
            急救指引
          </a>

          <!-- 風險計算器 -->
          <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">
            風險計算器
          </a>

          <!-- 權利知識 -->
          <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">
            權利知識
          </a>

          <!-- 求助資源 -->
          <a href="/help.html" class="ag-menu-button ag-menu-button--help">
            求助資源
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="ag-footer">
      <div class="ag-footer-standard">
        <div class="ag-footer__inner">
          <nav class="ag-footer__links" aria-label="Legal and info links">
            <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
            <span class="ag-footer__separator">•</span>
            <a href="/legal.html" class="ag-footer__link">法律免責</a>
            <span class="ag-footer__separator">•</span>
            <a href="/terms.html" class="ag-footer__link">使用條款</a>
            <span class="ag-footer__separator">•</span>
            <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
          </nav>
          <p class="ag-footer__copyright">
            © 2025 Afterglow. All rights reserved.
          </p>
        </div>
      </div>
    </footer>
</body>
</html>
