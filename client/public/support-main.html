<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <link rel="stylesheet" href="/assets/shared-emergency.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* ── accent 色：緊急支援選單 — 冷白冰藍 ── */
    :root {
      --em-accent:      rgba(220, 245, 255, 0.80);
      --em-accent-glow: rgba(220, 245, 255, 0.22);
    }
    .ag-page-title-block {
      padding: calc(88px + env(safe-area-inset-top, 0px)) 20px 4px;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .ag-page-title { font-size: 12px; color: rgba(255,255,255,0.35); letter-spacing: 0.10em; text-transform: uppercase; margin: 0; }

    .ag-main-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px 20px;
      box-sizing: border-box;
    }

    .ag-support-inner {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .ag-capsule-list {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      width: 100%;
      padding: 0 4px;
    }

    /* 共用膠囊基底：對齊首頁藥丸視覺語言 */
    .ag-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.10em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      position: relative;
      transition: box-shadow 0.35s ease, transform 0.30s ease;
    }

    /* 急救指引 — 最細最短，靠右，微小轉角 */
    .ag-menu-button:nth-child(1) {
      height: 44px;
      width: clamp(160px, 52%, 240px);
      align-self: flex-end;
      margin-right: 5%;
      margin-bottom: 22px;
      transform: rotate(-1.8deg);
    }
    /* 風險計算機 — 最寬最高，靠左，視覺重心 */
    .ag-menu-button:nth-child(2) {
      height: 56px;
      width: clamp(240px, 84%, 380px);
      align-self: flex-start;
      margin-left: 2%;
      margin-bottom: 18px;
      transform: rotate(1.4deg);
    }
    /* 權利知識 — 中等，靠右，略低 */
    .ag-menu-button:nth-child(3) {
      height: 48px;
      width: clamp(190px, 64%, 290px);
      align-self: flex-end;
      margin-right: 7%;
      margin-bottom: 20px;
      transform: rotate(-1.0deg) translateY(2px);
    }
    /* 求助資源 — 偏寬，靠左，收尾 */
    .ag-menu-button:nth-child(4) {
      height: 52px;
      width: clamp(210px, 74%, 340px);
      align-self: flex-start;
      margin-left: 4%;
      margin-bottom: 0;
      transform: rotate(1.8deg) translateY(-1px);
    }

    /* ──────────────────────────────────────────
       急救指引 — 煙粉暗紅
       對應 first-aid.html: rgba(255, 205, 195)
    ────────────────────────────────────────── */
    .ag-menu-button--first-aid {
      border: 1.5px solid rgba(255, 160, 140, 0.75);
      background: radial-gradient(ellipse at center, rgba(255,160,140,0.12) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(220,100,80,0.35), inset 0 0 14px rgba(255,160,140,0.14);
      color: rgba(255, 220, 210, 0.95);
      animation: ag-breathe-red 4.5s ease-in-out infinite;
    }
    .ag-menu-button--first-aid:hover,
    .ag-menu-button--first-aid:active {
      box-shadow: 0 0 22px rgba(220,100,80,0.55), inset 0 0 20px rgba(255,160,140,0.24);
      transform: rotate(-1.8deg) scale(1.03);
      animation: none;
    }

    /* ──────────────────────────────────────────
       風險計算機 — 冷紫灰
       對應 risk-calculator.html: rgba(195, 175, 240)
    ────────────────────────────────────────── */
    .ag-menu-button--risk {
      border: 1.5px solid rgba(180, 155, 230, 0.72);
      background: radial-gradient(ellipse at center, rgba(180,155,230,0.12) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(160,130,220,0.32), inset 0 0 14px rgba(180,155,230,0.14);
      color: rgba(215, 205, 250, 0.95);
      animation: ag-breathe-violet 4s ease-in-out infinite;
    }
    .ag-menu-button--risk:hover,
    .ag-menu-button--risk:active {
      box-shadow: 0 0 22px rgba(160,130,220,0.52), inset 0 0 20px rgba(180,155,230,0.24);
      transform: rotate(1.4deg) scale(1.03);
      animation: none;
    }

    /* ──────────────────────────────────────────
       權利知識 — 冷藍灰
       對應 rights.html: rgba(175, 205, 235)
    ────────────────────────────────────────── */
    .ag-menu-button--rights {
      border: 1.5px solid rgba(155, 190, 225, 0.72);
      background: radial-gradient(ellipse at center, rgba(155,190,225,0.12) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(130,175,220,0.32), inset 0 0 14px rgba(155,190,225,0.14);
      color: rgba(200, 220, 245, 0.95);
      animation: ag-breathe-blue 5s ease-in-out infinite;
    }
    .ag-menu-button--rights:hover,
    .ag-menu-button--rights:active {
      box-shadow: 0 0 22px rgba(130,175,220,0.52), inset 0 0 20px rgba(155,190,225,0.24);
      transform: rotate(-1.0deg) scale(1.03);
      animation: none;
    }

    /* ──────────────────────────────────────────
       求助資源 — 冷青灰
       對應 help.html: rgba(155, 215, 205)
    ────────────────────────────────────────── */
    .ag-menu-button--help {
      border: 1.5px solid rgba(135, 200, 190, 0.72);
      background: radial-gradient(ellipse at center, rgba(135,200,190,0.12) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(110,190,180,0.32), inset 0 0 14px rgba(135,200,190,0.14);
      color: rgba(195, 235, 230, 0.95);
      animation: ag-breathe-teal 4.8s ease-in-out infinite;
    }
    .ag-menu-button--help:hover,
    .ag-menu-button--help:active {
      box-shadow: 0 0 22px rgba(110,190,180,0.52), inset 0 0 20px rgba(135,200,190,0.24);
      transform: rotate(1.8deg) scale(1.03);
      animation: none;
    }

    /* ── 呼吸動畫 — 各色自己的節奏略有差異 ── */
    @keyframes ag-breathe-red {
      0%, 100% { box-shadow: 0 0 10px rgba(220,100,80,0.35), inset 0 0 14px rgba(255,160,140,0.14); }
      50%       { box-shadow: 0 0 16px rgba(220,100,80,0.52), inset 0 0 18px rgba(255,160,140,0.22); }
    }
    @keyframes ag-breathe-violet {
      0%, 100% { box-shadow: 0 0 10px rgba(160,130,220,0.32), inset 0 0 14px rgba(180,155,230,0.14); }
      50%       { box-shadow: 0 0 16px rgba(160,130,220,0.48), inset 0 0 18px rgba(180,155,230,0.22); }
    }
    @keyframes ag-breathe-blue {
      0%, 100% { box-shadow: 0 0 10px rgba(130,175,220,0.32), inset 0 0 14px rgba(155,190,225,0.14); }
      50%       { box-shadow: 0 0 16px rgba(130,175,220,0.48), inset 0 0 18px rgba(155,190,225,0.22); }
    }
    @keyframes ag-breathe-teal {
      0%, 100% { box-shadow: 0 0 10px rgba(110,190,180,0.32), inset 0 0 14px rgba(135,200,190,0.14); }
      50%       { box-shadow: 0 0 16px rgba(110,190,180,0.48), inset 0 0 18px rgba(135,200,190,0.22); }
    }
  </style>
</head>

        <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">急救指引</a>
        <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">風險計算機</a>
        <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">權利知識</a>
        <a href="/help.html" class="ag-menu-button ag-menu-button--help">求助資源</a>
      </div>
    </div>
  </main>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">

        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
