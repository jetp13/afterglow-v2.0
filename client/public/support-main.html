<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    .ag-page-logo {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 20px;
      z-index: 100;
      display: block;
      text-decoration: none;
    }
    .ag-page-logo img {
      display: block;
      width: 110px;
      opacity: 0.85;
    }

    .ag-page-title-block {
      padding: calc(88px + env(safe-area-inset-top, 0px)) 20px 4px;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .ag-page-title {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    .ag-main-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px 20px;
      box-sizing: border-box;
    }

    .ag-support-inner {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .ag-capsule-list {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      width: 100%;
      padding: 0 4px;
    }

    /* 共用膠囊基底：對齊首頁藥丸視覺語言 */
    .ag-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.10em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      position: relative;
      transition: box-shadow 0.35s ease, transform 0.30s ease;
    }

    /* 急救指引 — 最細最短，靠右，微小轉角 */
    .ag-menu-button:nth-child(1) {
      height: 44px;
      width: clamp(160px, 52%, 240px);
      align-self: flex-end;
      margin-right: 5%;
      margin-bottom: 22px;
      transform: rotate(-1.8deg);
    }
    /* 風險計算器 — 最寬最高，靠左，視覺重心 */
    .ag-menu-button:nth-child(2) {
      height: 56px;
      width: clamp(240px, 84%, 380px);
      align-self: flex-start;
      margin-left: 2%;
      margin-bottom: 18px;
      transform: rotate(1.4deg);
    }
    /* 權利知識 — 中等，靠右，略低 */
    .ag-menu-button:nth-child(3) {
      height: 48px;
      width: clamp(190px, 64%, 290px);
      align-self: flex-end;
      margin-right: 7%;
      margin-bottom: 20px;
      transform: rotate(-1.0deg) translateY(2px);
    }
    /* 求助資源 — 偏寬，靠左，收尾 */
    .ag-menu-button:nth-child(4) {
      height: 52px;
      width: clamp(210px, 74%, 340px);
      align-self: flex-start;
      margin-left: 4%;
      margin-bottom: 0;
      transform: rotate(1.8deg) translateY(-1px);
    }

    /* 急救指引 — 青 Cyan */
    .ag-menu-button--first-aid {
      border: 1.5px solid #00e5ff;
      background: radial-gradient(ellipse at center, rgba(0,229,255,0.14) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(0,229,255,0.42), inset 0 0 14px rgba(0,229,255,0.18);
      color: #d8feff;
      animation: ag-breathe-cyan 4.5s ease-in-out infinite;
    }
    .ag-menu-button--first-aid:hover,
    .ag-menu-button--first-aid:active {
      box-shadow: 0 0 24px rgba(0,229,255,0.72), inset 0 0 20px rgba(0,229,255,0.30);
      transform: rotate(-1.8deg) scale(1.03);
      animation: none;
    }

    /* 風險計算器 — 粉紫 Magenta */
    .ag-menu-button--risk {
      border: 1.5px solid #ff6bd9;
      background: radial-gradient(ellipse at center, rgba(255,107,217,0.14) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(255,107,217,0.42), inset 0 0 14px rgba(255,107,217,0.18);
      color: #ffe0f5;
      animation: ag-breathe-pink 4s ease-in-out infinite;
    }
    .ag-menu-button--risk:hover,
    .ag-menu-button--risk:active {
      box-shadow: 0 0 24px rgba(255,107,217,0.72), inset 0 0 20px rgba(255,107,217,0.30);
      transform: rotate(1.4deg) scale(1.03);
      animation: none;
    }

    /* 權利知識 — 紫色 Purple */
    .ag-menu-button--rights {
      border: 1.5px solid #bd00ff;
      background: radial-gradient(ellipse at center, rgba(189,0,255,0.14) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(189,0,255,0.42), inset 0 0 14px rgba(189,0,255,0.18);
      color: #f0e0ff;
      animation: ag-breathe-purple 5s ease-in-out infinite;
    }
    .ag-menu-button--rights:hover,
    .ag-menu-button--rights:active {
      box-shadow: 0 0 24px rgba(189,0,255,0.72), inset 0 0 20px rgba(189,0,255,0.30);
      transform: rotate(-1.0deg) scale(1.03);
      animation: none;
    }

    /* 求助資源 — 綠色 Green */
    .ag-menu-button--help {
      border: 1.5px solid #00ff88;
      background: radial-gradient(ellipse at center, rgba(0,255,136,0.14) 0%, transparent 70%);
      box-shadow: 0 0 10px rgba(0,255,136,0.42), inset 0 0 14px rgba(0,255,136,0.18);
      color: #d8fff0;
      animation: ag-breathe-green 4.8s ease-in-out infinite;
    }
    .ag-menu-button--help:hover,
    .ag-menu-button--help:active {
      box-shadow: 0 0 24px rgba(0,255,136,0.72), inset 0 0 20px rgba(0,255,136,0.30);
      transform: rotate(1.8deg) scale(1.03);
      animation: none;
    }

    /* 呼吸動畫—各色自己的節奏略有差異 */
    @keyframes ag-breathe-cyan {
      0%, 100% { box-shadow: 0 0 10px rgba(0,229,255,0.42), inset 0 0 14px rgba(0,229,255,0.18); }
      50%       { box-shadow: 0 0 18px rgba(0,229,255,0.60), inset 0 0 18px rgba(0,229,255,0.26); }
    }
    @keyframes ag-breathe-pink {
      0%, 100% { box-shadow: 0 0 10px rgba(255,107,217,0.42), inset 0 0 14px rgba(255,107,217,0.18); }
      50%       { box-shadow: 0 0 18px rgba(255,107,217,0.60), inset 0 0 18px rgba(255,107,217,0.26); }
    }
    @keyframes ag-breathe-purple {
      0%, 100% { box-shadow: 0 0 10px rgba(189,0,255,0.42), inset 0 0 14px rgba(189,0,255,0.18); }
      50%       { box-shadow: 0 0 18px rgba(189,0,255,0.60), inset 0 0 18px rgba(189,0,255,0.26); }
    }
    @keyframes ag-breathe-green {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,136,0.42), inset 0 0 14px rgba(0,255,136,0.18); }
      50%       { box-shadow: 0 0 18px rgba(0,255,136,0.60), inset 0 0 18px rgba(0,255,136,0.26); }
    }
  </style>
</head>
<body class="ag-page">

  <a href="/home.html" class="ag-back-button" aria-label="返回上一頁"></a>

  <a href="/home.html" class="ag-page-logo" aria-label="返回首頁">
    <img src="/assets/logo-transparent.png" alt="Afterglow">
  </a>

  <div class="ag-page-title-block">
    <p class="ag-page-title">緊急支援 · Emergency Support</p>
  </div>

  <main class="ag-main-scroll">
    <div class="ag-support-inner">
      <div class="ag-capsule-list">
        <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">急救指引</a>
        <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">風險計算器</a>
        <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">權利知識</a>
        <a href="/help.html" class="ag-menu-button ag-menu-button--help">求助資源</a>
      </div>
    </div>
  </main>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2025 Afterglow. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
