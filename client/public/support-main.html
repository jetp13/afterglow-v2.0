<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* Flexbox Sticky Footer Structure */
    html, body {
      margin: 0;
      padding: 0;
    }
    .ag-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    .ag-main-scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .ag-support-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(90px + env(safe-area-inset-top)) 20px 32px;
      box-sizing: border-box;
      gap: 16px; /* Reduced gap for compactness */
      position: relative;
      z-index: 1;
    }

    .ag-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 60px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      transition: 0.3s ease;
      position: relative;
      background: rgba(0, 0, 0, 0.3);
    }

    /* 急救指引 - 藍綠色 Glow */
    .ag-menu-button--first-aid {
      border: 2px solid #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.1);
      color: #e0ffff;
    }
    .ag-menu-button--first-aid:hover {
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.7), inset 0 0 15px rgba(0, 229, 255, 0.2);
      background: rgba(0, 229, 255, 0.1);
    }

    /* 風險計算器 - 桃紅色 Glow */
    .ag-menu-button--risk {
      border: 2px solid #ff6bd9;
      box-shadow: 0 0 15px rgba(255, 107, 217, 0.4), inset 0 0 10px rgba(255, 107, 217, 0.1);
      color: #ffe0f5;
    }
    .ag-menu-button--risk:hover {
      box-shadow: 0 0 25px rgba(255, 107, 217, 0.7), inset 0 0 15px rgba(255, 107, 217, 0.2);
      background: rgba(255, 107, 217, 0.1);
    }

    /* 權利知識 - 紫色 Glow */
    .ag-menu-button--rights {
      border: 2px solid #bd00ff;
      box-shadow: 0 0 15px rgba(189, 0, 255, 0.4), inset 0 0 10px rgba(189, 0, 255, 0.1);
      color: #f0e0ff;
    }
    .ag-menu-button--rights:hover {
      box-shadow: 0 0 25px rgba(189, 0, 255, 0.7), inset 0 0 15px rgba(189, 0, 255, 0.2);
      background: rgba(189, 0, 255, 0.1);
    }

    .ag-wild-header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 20px;
    }

    /* Footer Adjustments */
    .ag-footer-standard {
      margin-top: auto;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="ag-page">
  <!-- Back Button (Fixed Position) -->
  <a href="/home.html" class="ag-back-button neon-style" aria-label="返回">
    <span class="ag-neon-icon-back"></span>
  </a>

  <div class="ag-main-scroll">
    <div class="ag-support-menu">
        
        <!-- Compact Header -->
        <div class="ag-wild-header">
          <a href="/index.html">
            <img src="/assets/logo-handwritten.png" class="ag-wild-logo" alt="Afterglow" style="width: 120px; opacity: 0.8;">
          </a>
        </div>

        <!-- 急救指引 -->
        <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">
          急救指引
        </a>

        <!-- 風險計算器 -->
        <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">
          風險計算器
        </a>

        <!-- 權利知識 -->
        <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">
          權利知識
        </a>

        <!-- 求助資源 -->
        <a href="/help.html" class="ag-menu-button ag-menu-button--help" style="border: 2px solid #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); color: #e0ffe0;">
          求助資源
        </a>

    </div>

    <!-- Footer: Standard Sticky Footer -->
    <footer class="ag-footer-standard">
      <div class="ag-footer__inner">
        <div class="ag-footer__links">
          <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
          <span class="ag-footer__separator">|</span>
          <a href="/legal.html" class="ag-footer__link">法律免責</a>
          <span class="ag-footer__separator">|</span>
          <a href="/terms.html" class="ag-footer__link">使用條款</a>
          <span class="ag-footer__separator">|</span>
          <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
        </div>
        <div class="ag-footer__copyright">
          &copy; 2025 Afterglow. All rights reserved.
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
