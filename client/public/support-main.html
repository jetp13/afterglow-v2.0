<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>緊急支援選單｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* ── Header ── */
    .ag-inner-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 20px 10px;
      box-sizing: border-box;
      min-height: 56px;
    }

    .ag-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .ag-back-btn:hover { border-color: rgba(255,255,255,0.6); color: #fff; }

    /* Page label */
    .ag-page-title-block {
      padding: 0 20px 4px;
      flex-shrink: 0;
    }
    .ag-page-title {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    /* ── Main scroll area ── */
    .ag-main-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 20px 20px;
      box-sizing: border-box;
    }

    .ag-support-inner {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Capsule List ── */
    .ag-capsule-list {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      width: 100%;
      padding: 0 8px;
    }

    /* Base capsule */
    .ag-menu-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 56px;
      border-radius: 28px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      text-decoration: none;
      background: rgba(0,0,0,0.25);
      position: relative;
      white-space: nowrap;
      transition: box-shadow 0.25s ease, background 0.25s ease;
    }

    /* Scattered landing: each capsule has its own width, margin, and angle */
    .ag-menu-button:nth-child(1) {
      width: 68%;
      align-self: flex-end;
      margin-right: 4%;
      transform: rotate(-4.5deg);
    }
    .ag-menu-button:nth-child(2) {
      width: 74%;
      align-self: flex-start;
      margin-left: 2%;
      transform: rotate(5deg);
    }
    .ag-menu-button:nth-child(3) {
      width: 62%;
      align-self: flex-end;
      margin-right: 8%;
      transform: rotate(-3deg);
    }
    .ag-menu-button:nth-child(4) {
      width: 70%;
      align-self: flex-start;
      margin-left: 6%;
      transform: rotate(6.5deg);
    }

    /* 急救指引 — 藍綠 */
    .ag-menu-button--first-aid {
      border: 1.5px solid #00e5ff;
      box-shadow: 0 0 12px rgba(0,229,255,0.35), inset 0 0 8px rgba(0,229,255,0.08);
      color: #d8feff;
    }
    .ag-menu-button--first-aid:hover {
      box-shadow: 0 0 22px rgba(0,229,255,0.65), inset 0 0 12px rgba(0,229,255,0.18);
      background: rgba(0,229,255,0.08);
    }

    /* 風險計算器 — 桃紅 */
    .ag-menu-button--risk {
      border: 1.5px solid #ff6bd9;
      box-shadow: 0 0 12px rgba(255,107,217,0.35), inset 0 0 8px rgba(255,107,217,0.08);
      color: #ffe0f5;
    }
    .ag-menu-button--risk:hover {
      box-shadow: 0 0 22px rgba(255,107,217,0.65), inset 0 0 12px rgba(255,107,217,0.18);
      background: rgba(255,107,217,0.08);
    }

    /* 權利知識 — 紫 */
    .ag-menu-button--rights {
      border: 1.5px solid #bd00ff;
      box-shadow: 0 0 12px rgba(189,0,255,0.35), inset 0 0 8px rgba(189,0,255,0.08);
      color: #f0e0ff;
    }
    .ag-menu-button--rights:hover {
      box-shadow: 0 0 22px rgba(189,0,255,0.65), inset 0 0 12px rgba(189,0,255,0.18);
      background: rgba(189,0,255,0.08);
    }

    /* 求助資源 — 綠 */
    .ag-menu-button--help {
      border: 1.5px solid #00ff88;
      box-shadow: 0 0 12px rgba(0,255,136,0.35), inset 0 0 8px rgba(0,255,136,0.08);
      color: #d8fff0;
    }
    .ag-menu-button--help:hover {
      box-shadow: 0 0 22px rgba(0,255,136,0.65), inset 0 0 12px rgba(0,255,136,0.18);
      background: rgba(0,255,136,0.08);
    }

    /* ── Footer ── */
    .ag-footer {
      flex-shrink: 0;
      padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .ag-footer__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .ag-footer__links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 5px 12px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      width: 100%;
    }

    .ag-footer__link {
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .ag-footer__link:hover { color: rgba(255,255,255,0.75); }

    .ag-footer__separator {
      color: rgba(255,255,255,0.2);
      font-size: 12px;
    }

    .ag-footer__copyright {
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.05em;
      margin: 0;
    }
  </style>
</head>
<body class="ag-page">

  <!-- Header: Back + Logo area -->
  <header class="ag-inner-header">
    <a href="/home.html" class="ag-back-btn" aria-label="返回首頁">&#8592;</a>
    <a href="/home.html" aria-label="返回首頁" style="display:inline-flex;">
      <img src="/assets/logo-transparent.png"
           style="width:72px;height:auto;opacity:0.75;mix-blend-mode:screen;"
           alt="Afterglow">
    </a>
  </header>

  <!-- Page label -->
  <div class="ag-page-title-block">
    <p class="ag-page-title">緊急支援 · Emergency Support</p>
  </div>

  <!-- Main capsule area -->
  <main class="ag-main-scroll">
    <div class="ag-support-inner">
      <div class="ag-capsule-list">

        <a href="/first-aid.html" class="ag-menu-button ag-menu-button--first-aid">
          急救指引
        </a>

        <a href="/risk-calculator.html" class="ag-menu-button ag-menu-button--risk">
          風險計算器
        </a>

        <a href="/rights.html" class="ag-menu-button ag-menu-button--rights">
          權利知識
        </a>

        <a href="/help.html" class="ag-menu-button ag-menu-button--help">
          求助資源
        </a>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="ag-footer">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="頁面連結">
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
        <span class="ag-footer__separator">·</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">·</span>
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">·</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
      </nav>
      <p class="ag-footer__copyright">© 2025 Afterglow</p>
    </div>
  </footer>

</body>
</html>
