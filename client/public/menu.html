<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冥想選單｜Afterglow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* Flexbox Sticky Footer Structure */
    html, body {
      height: 100%;
      margin: 0;
    }
    .ag-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ag-menu-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Breathing Sphere Background */
    .ag-breathing-sphere-bg {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vw;
      max-width: 300px;
      max-height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
      animation: breathe-bg 8s infinite ease-in-out;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes breathe-bg {
      0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
    }

    .ag-menu-title {
      font-size: 20px; /* Reduced size */
      color: #fff;
      margin-bottom: 24px; /* Reduced margin */
      letter-spacing: 2px;
      font-weight: 300;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .ag-menu-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .ag-menu-item {
      display: block;
      padding: 16px; /* Reduced padding for compactness */
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; /* Slightly smaller radius */
      color: #fff;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .ag-menu-item:hover, .ag-menu-item:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .ag-item-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
    }

    .ag-item-desc {
      font-size: 12px;
      color: #aaa;
      font-weight: 300;
      display: block;
    }

    /* Glow effects for specific items */
    .ag-menu-item.breathing {
      border-color: rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }
    .ag-menu-item.breathing:hover {
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    }

    .ag-menu-item.voice {
      border-color: rgba(189, 0, 255, 0.3);
      box-shadow: 0 0 15px rgba(189, 0, 255, 0.1);
    }
    .ag-menu-item.voice:hover {
      box-shadow: 0 0 25px rgba(189, 0, 255, 0.2);
    }

    /* Accordion Styles */
    .ag-menu-details {
      width: 100%;
      margin-top: 10px;
    }
    
    .ag-menu-summary {
      list-style: none;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      padding: 10px;
      border-radius: 8px;
      transition: color 0.3s;
    }
    
    .ag-menu-summary:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .ag-menu-summary::-webkit-details-marker {
      display: none;
    }
    
    .ag-menu-sublist {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

  </style>
</head>
<body class="ag-page">
  <!-- Back to Home (Fixed Position) -->
  <a href="/home.html" class="ag-back-button neon-style" aria-label="返回首頁">
    <span class="ag-neon-icon-back"></span>
  </a>

  <!-- Removed ag-main-scroll to prevent scrolling (C2) -->
  <div class="ag-menu-container">
      <!-- Breathing Sphere Visual -->
      <div class="ag-breathing-sphere-bg"></div>

      <!-- Compact Header -->
      <div class="ag-wild-header" style="margin-bottom: 20px;">
        <img src="/assets/logo-handwritten.png" class="ag-wild-logo" alt="Afterglow" style="width: 120px; opacity: 0.8;">
      </div>

      <h1 class="ag-menu-title">選擇冥想模式</h1>
      
      <div class="ag-menu-list">
        <a href="/breathing.html" class="ag-menu-item breathing">
          <span class="ag-item-title">呼吸練習</span>
          <span class="ag-item-desc">4-7-8 呼吸法，平靜身心</span>
        </a>
        
        <a href="/voice.html" class="ag-menu-item voice">
          <span class="ag-item-title">語音引導</span>
          <span class="ag-item-desc">跟隨聲音，進入深層放鬆</span>
        </a>
        
        <!-- Collapsible Secondary Options -->
        <details class="ag-menu-details">
          <summary class="ag-menu-summary">更多模式</summary>
          <div class="ag-menu-sublist">
            <a href="/white-noise.html" class="ag-menu-item">
              <span class="ag-item-title">白噪音</span>
              <span class="ag-item-desc">專注與放鬆的背景音</span>
            </a>
          </div>
        </details>
      </div>
    </div>

    </div>
    <!-- End of ag-menu-container -->

    <!-- Footer: Standard Sticky Footer -->
    <footer class="ag-footer-standard">
      <div class="ag-footer__inner">
        <nav class="ag-footer__links" aria-label="Legal and info links">
          <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
          <span class="ag-footer__separator">•</span>
          <a href="/legal.html" class="ag-footer__link">法律免責</a>
          <span class="ag-footer__separator">•</span>
          <a href="/terms.html" class="ag-footer__link">使用條款</a>
          <span class="ag-footer__separator">•</span>
          <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
        </nav>
        <p class="ag-footer__copyright">
          © 2025 Afterglow. All rights reserved.
        </p>
      </div>
    </footer>

  <script>
    // Register Service Worker if not already registered
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
