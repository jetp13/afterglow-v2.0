<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冥想選單｜Afterglow</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    .ag-menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh; /* Ensure content is centered but fits in view */
      padding: 40px 20px 20px;
      text-align: center;
    }

    .ag-menu-title {
      font-size: 24px;
      color: #fff;
      margin-bottom: 40px;
      letter-spacing: 2px;
      font-weight: 300;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .ag-menu-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 320px;
    }

    .ag-menu-item {
      display: block;
      padding: 16px; /* Reduced padding for compactness */
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; /* Slightly smaller radius */
      color: #fff;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .ag-menu-item:hover, .ag-menu-item:active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .ag-item-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
    }

    .ag-item-desc {
      font-size: 12px;
      color: #aaa;
      font-weight: 300;
      display: block;
    }

    /* Glow effects for specific items */
    .ag-menu-item.breathing {
      border-color: rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }
    .ag-menu-item.breathing:hover {
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    }

    .ag-menu-item.voice {
      border-color: rgba(189, 0, 255, 0.3);
      box-shadow: 0 0 15px rgba(189, 0, 255, 0.1);
    }
    .ag-menu-item.voice:hover {
      box-shadow: 0 0 25px rgba(189, 0, 255, 0.2);
    }

    /* Accordion Styles */
    .ag-menu-details {
      width: 100%;
      margin-top: 10px;
    }
    
    .ag-menu-summary {
      list-style: none;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      padding: 10px;
      border-radius: 8px;
      transition: color 0.3s;
    }
    
    .ag-menu-summary:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .ag-menu-summary::-webkit-details-marker {
      display: none;
    }
    
    .ag-menu-sublist {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

  </style>
</head>
<body class="ag-page">
  <!-- Back to Home (Fixed Position) -->
  <a href="/home.html" class="ag-back-button neon-style" aria-label="返回首頁">
    <span class="ag-neon-icon-back"></span>
  </a>

  <div class="ag-main-scroll">
    <div class="ag-menu-container">
      <!-- Wild Header -->
      <div class="ag-wild-header ag-mb-20">
        <img src="/assets/logo-handwritten.png" class="ag-wild-logo" alt="Afterglow">
      </div>

      <h1 class="ag-menu-title ag-visually-hidden">選擇冥想模式</h1>
      
      <div class="ag-menu-list">
        <a href="/breathing.html" class="ag-menu-item breathing">
          <span class="ag-item-title">呼吸練習</span>
          <span class="ag-item-desc">4-7-8 呼吸法，平靜身心</span>
        </a>
        
        <a href="/voice.html" class="ag-menu-item voice">
          <span class="ag-item-title">語音引導</span>
          <span class="ag-item-desc">跟隨聲音，進入深層放鬆</span>
        </a>
        
        <!-- Collapsible Secondary Options -->
        <details class="ag-menu-details">
          <summary class="ag-menu-summary">更多模式</summary>
          <div class="ag-menu-sublist">
            <div class="ag-menu-item ag-disabled">
              <span class="ag-item-title">白噪音</span>
              <span class="ag-item-desc">即將推出</span>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- Footer：共用模組 -->
    <footer class="ag-footer">
      <div class="ag-footer__inner">
        <nav class="ag-footer__links" aria-label="Legal and info links">
          <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
          <span class="ag-footer__separator">•</span>
          <a href="/legal.html" class="ag-footer__link">法律免責</a>
          <span class="ag-footer__separator">•</span>
          <a href="/terms.html" class="ag-footer__link">使用條款</a>
          <span class="ag-footer__separator">•</span>
          <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
        </nav>

        <p class="ag-footer__copyright">
          © 2025 Afterglow. All rights reserved.
        </p>
      </div>
    </footer>
  </div>

  <script>
    // Register Service Worker if not already registered
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
