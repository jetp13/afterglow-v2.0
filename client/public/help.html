<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>求助資源｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <style>
    .ag-help-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    .ag-help-title {
      font-size: 24px;
      color: #ff6bd9;
      margin-bottom: 40px;
      text-shadow: 0 0 15px rgba(255, 107, 217, 0.4);
    }

    .ag-help-list {
      display: grid;
      gap: 20px;
      list-style: none;
      padding: 0;
    }

    .ag-help-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .ag-help-name {
      font-size: 18px;
      color: #fff;
      font-weight: 500;
    }

    .ag-help-phone {
      font-size: 28px;
      color: #ff6bd9;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 2px;
    }

    .ag-help-desc {
      font-size: 13px;
      color: #aaa;
    }

    .ag-emergency-box {
      border: 1px solid #ff4444;
      background: rgba(255, 68, 68, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 40px;
    }

    .ag-emergency-title {
      color: #ff4444;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .ag-emergency-text {
      color: #ddd;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body class="ag-page">
  
  <!-- 返回按鈕 -->
  <a href="javascript:history.back()" class="ag-back-button" style="position: fixed; top: 20px; left: 20px; color: #999; text-decoration: none; font-size: 14px; z-index: 10; padding: 8px 12px; background: rgba(0,0,0,0.5); border-radius: 20px; backdrop-filter: blur(5px);">
    ← 返回
  </a>

  <div class="ag-help-container">
    <h1 class="ag-help-title">求助資源</h1>

    <div class="ag-emergency-box">
      <div class="ag-emergency-title">緊急狀況</div>
      <p class="ag-emergency-text">
        若您或身邊的人出現身體不適、呼吸困難、失去意識等危急情況，請立即撥打緊急醫療電話。
      </p>
      <a href="tel:119" class="ag-help-phone" style="color: #ff4444; display: block; margin-top: 10px;">119</a>
    </div>

    <ul class="ag-help-list">
      <li class="ag-help-item">
        <span class="ag-help-name">衛生福利部安心專線</span>
        <a href="tel:1925" class="ag-help-phone">1925</a>
        <span class="ag-help-desc">提供心理諮詢與自殺防治服務（24小時）</span>
      </li>

      <li class="ag-help-item">
        <span class="ag-help-name">生命線協談專線</span>
        <a href="tel:1995" class="ag-help-phone">1995</a>
        <span class="ag-help-desc">提供各類心理困擾與危機處理諮詢</span>
      </li>

      <li class="ag-help-item">
        <span class="ag-help-name">張老師輔導專線</span>
        <a href="tel:1980" class="ag-help-phone">1980</a>
        <span class="ag-help-desc">提供情緒困擾與心理輔導服務</span>
      </li>

      <li class="ag-help-item">
        <span class="ag-help-name">勵馨基金會</span>
        <a href="tel:0289118595" class="ag-help-phone">02-8911-8595</a>
        <span class="ag-help-desc">提供性侵害與家庭暴力受害者支持</span>
      </li>
    </ul>

    <div style="margin-top: 40px; font-size: 13px; color: #666; line-height: 1.6;">
      本頁面資訊僅供參考，若遇緊急危難，請優先撥打 119 求助。<br>
      Afterglow 關心您的安全。
    </div>
  </div>
</body>
</html>
