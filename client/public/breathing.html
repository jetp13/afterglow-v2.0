<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呼吸練習｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* Logo: fixed top-right */
    .ag-page-logo {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 20px;
      z-index: 100;
      pointer-events: none;
    }
    .ag-page-logo img {
      width: 110px;
      opacity: 0.85;
      display: block;
    }
    .ag-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh; /* Force full height (D1) */
      text-align: center;
      color: #fff;
      padding: 20px;
      overflow: hidden; /* Prevent scrolling (D1) */
    }
    .ag-breathing-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .ag-circle-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      animation: breathe 8s infinite ease-in-out;
      z-index: 1;
    }
    .ag-breathing-text {
      position: absolute; /* Center absolutely to avoid layout shifts */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* Perfect centering */
      z-index: 2;
      font-size: 24px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      /* Rule C: Text MUST remain fixed size (no transform: scale) */
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 50px rgba(0, 229, 255, 0.6); }
    }
  </style>
</head>
<body class="ag-page">
  <!-- Back Button (Fixed Position) -->
  <a href="/menu.html" class="ag-back-button neon-style" aria-label="返回選單">
    <span class="ag-neon-icon-back"></span>
  </a>

  <!-- Logo: fixed top-right -->
  <div class="ag-page-logo">
    <img src="/assets/logo-handwritten.png" alt="Afterglow">
  </div>

  <!-- Removed ag-main-scroll to prevent scrolling (D1) -->
  <div class="ag-container">
      <div class="ag-breathing-wrapper">
        <div class="ag-circle-glow"></div>
        <div class="ag-breathing-text" id="breathing-text">吸氣</div>
      </div>
      <p class="ag-mt-20" style="opacity: 0.7;">跟隨圓圈的節奏呼吸</p>

      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const textEl = document.getElementById('breathing-text');
          const circleEl = document.querySelector('.ag-circle-glow');
          
          // Sync text with animation cycle (8s total: 4s in, 4s out)
          // Animation starts immediately on load.
          // We assume 0-50% is expand (Inhale), 50-100% is shrink (Exhale).
          
          function updateText() {
            textEl.innerText = '吸氣'; // Start with Inhale
            
            setTimeout(() => {
              textEl.innerText = '吐氣'; // Switch to Exhale at 4s
            }, 4000);
          }

          // Initial run
          updateText();

          // Loop every 8s
          setInterval(updateText, 8000);
        });
      </script>
      <a href="/menu.html" class="ag-mt-40 ag-text-gray ag-link-clean">← 結束練習</a>
    </div>

    <!-- Footer Removed for Immersive Page (Rule B) -->
  <!-- End of ag-container -->
</body>
</html>
