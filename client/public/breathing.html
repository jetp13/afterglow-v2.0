<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呼吸練習｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    // Check for consent immediately
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    .ag-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: #fff;
    }
    .ag-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 40px;
      animation: breathe 8s infinite ease-in-out;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 50px rgba(0, 229, 255, 0.6); }
    }
  </style>
</head>
<body class="ag-page">
  <div class="ag-container">
    <div class="ag-circle">吸氣</div>
    <p>跟隨圓圈的節奏呼吸</p>
    <a href="/menu.html" style="margin-top: 40px; color: #aaa; text-decoration: none;">← 結束練習</a>
  </div>

  <!-- Footer：共用模組 -->
  <footer class="ag-footer">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>

        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>

        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>

      <p class="ag-footer__copyright">
        © 2025 Afterglow. All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
