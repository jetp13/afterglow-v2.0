<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呼吸練習｜Afterglow</title>
  <link rel="stylesheet" href="/assets/layout.css">
  <script>
    if (localStorage.getItem('ag_consent') !== 'true') {
      window.location.href = '/index.html';
    }
  </script>
  <style>
    /* ── Inner header (matches voice / white-noise) ── */
    .ag-inner-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
      box-sizing: border-box;
      min-height: 64px;
    }
    .ag-page-title-block { padding: 0 20px 8px; flex-shrink: 0; }
    .ag-page-title {
      font-size: 13px; color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em; text-transform: uppercase; margin: 0;
    }
    .ag-page-title strong { color: rgba(255,255,255,0.55); font-weight: 500; }

    .ag-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      color: #fff;
      padding: 20px;
      overflow: visible;
    }

    .ag-breathing-wrapper {
      position: relative;
      width: min(240px, 40vmin, 40vh);
      height: min(240px, 40vmin, 40vh);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .ag-circle-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      animation: breathe 8.57s infinite ease-in-out;
      z-index: 1;
    }

    .ag-breathing-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-size: 24px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Subtitle below the circle */
    .ag-breathing-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.04em;
      line-height: 1.6;
      min-height: 1.6em;
      transition: opacity 0.6s ease;
      margin-top: 0;
      margin-bottom: 32px;
    }

    .ag-breathing-subtitle.fade-out {
      opacity: 0;
    }

    @keyframes breathe {
      /* 8.57s cycle = ~7 breaths/min */
      /* 0–50% = inhale (expand), 50–100% = exhale (contract) */
      0%, 100% { transform: scale(0.8); opacity: 0.6; }
      50%       { transform: scale(1.1); opacity: 1; box-shadow: 0 0 50px rgba(0, 229, 255, 0.6); }
    }
  </style>
</head>
<body class="ag-page">

  <!-- Logo: fixed top-right -->
  <a href="/home.html" class="ag-site-logo" aria-label="回到首頁"><img src="/assets/logo-handwritten-nobg.png" alt="Afterglow"></a>

  <!-- Header with back button (matches voice / white-noise) -->
  <header class="ag-inner-header">
    <a href="/menu.html" class="ag-back-button" aria-label="返回選單"></a>
  </header>

  <!-- Page title block -->
  <div class="ag-page-title-block">
    <p class="ag-page-title"><strong>呼吸練習</strong> · BREATHING PRACTICE</p>
  </div>

  <div class="ag-container">
    <div class="ag-breathing-wrapper">
      <div class="ag-circle-glow"></div>
      <div class="ag-breathing-text" id="breathing-phase-text">吸氣</div>
    </div>

    <!-- Synced subtitle -->
    <p class="ag-breathing-subtitle" id="breathing-subtitle">吸氣，跟著圓圈慢慢放大</p>

    <a href="/menu.html" class="ag-mt-40 ag-text-gray ag-link-clean">← 結束練習</a>
  </div>

  <footer class="ag-footer-standard">
    <div class="ag-footer__inner">
      <nav class="ag-footer__links" aria-label="Legal and info links">
        <a href="/privacy.html" class="ag-footer__link">隱私權政策</a>
        <span class="ag-footer__separator">•</span>
        <a href="/legal.html" class="ag-footer__link">法律免責</a>
        <span class="ag-footer__separator">•</span>
        <a href="/terms.html" class="ag-footer__link">使用條款</a>
        <span class="ag-footer__separator">•</span>
        <a href="/about.html" class="ag-footer__link">關於 Afterglow</a>
      </nav>
      <p class="ag-footer__copyright">© 2026 Afterglow. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const phaseTextEl  = document.getElementById('breathing-phase-text');
      const subtitleEl   = document.getElementById('breathing-subtitle');

      // Subtitle pools
      const inhaleLines = [
        '吸氣，跟著圓圈慢慢放大',
        '吸氣，讓空氣輕輕進來',
        '吸氣，回到此刻',
        '吸氣，讓自己更穩定',
        '吸氣，感受光慢慢展開',
      ];
      const exhaleLines = [
        '吐氣，跟著圓圈慢慢縮小',
        '吐氣，慢慢把力氣放下',
        '吐氣，放下緊張',
        '吐氣，讓身體慢下來',
        '吐氣，感受自己慢慢沉下來',
      ];
      const neutralLines = [
        '不需要著急，只要跟著節奏',
        '如果分心了，就回到呼吸',
      ];

      let inhaleIdx  = 0;
      let exhaleIdx  = 0;
      let cycleCount = 0;

      // Cycle duration must match CSS animation-duration exactly
      const CYCLE_MS   = 8570;  // 8.57s = ~7 breaths/min
      const HALF_MS    = CYCLE_MS / 2;  // 4285ms per phase

      function setSubtitle(text) {
        subtitleEl.classList.add('fade-out');
        setTimeout(() => {
          subtitleEl.textContent = text;
          subtitleEl.classList.remove('fade-out');
        }, 300); // 300ms fade-out, then swap
      }

      function startInhalePhase() {
        phaseTextEl.textContent = '吸氣';

        // Every 5 cycles, show a neutral line during inhale
        let line;
        if (cycleCount > 0 && cycleCount % 5 === 0) {
          line = neutralLines[cycleCount % neutralLines.length];
        } else {
          line = inhaleLines[inhaleIdx % inhaleLines.length];
          inhaleIdx++;
        }
        setSubtitle(line);
      }

      function startExhalePhase() {
        phaseTextEl.textContent = '吐氣';
        const line = exhaleLines[exhaleIdx % exhaleLines.length];
        exhaleIdx++;
        setSubtitle(line);
      }

      function runCycle() {
        // Phase 1: Inhale (0 → HALF_MS)
        startInhalePhase();

        // Phase 2: Exhale (HALF_MS → CYCLE_MS)
        setTimeout(() => {
          startExhalePhase();
        }, HALF_MS);

        cycleCount++;
      }

      // Kick off immediately (synced to CSS animation which also starts at 0)
      runCycle();
      setInterval(runCycle, CYCLE_MS);
    });
  </script>
</body>
</html>
